<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220">
  <defs>
    <style>
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      @keyframes trace {
        0% { stroke-dashoffset: 2400; }
        100% { stroke-dashoffset: 0; }
      }
      .bg { fill: #1a1c20; }
      .ecg-line {
        fill: none;
        stroke: #4ade80;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(0 0 4px #4ade8050);
        stroke-dasharray: 2400;
        animation: trace 4s linear infinite;
      }
      .grid-line { stroke: #262a30; stroke-width: 0.5; }
      .label { fill: #4ade80; font-family: 'Courier New', monospace; font-size: 11px; }
      .value { fill: #e2e8f0; font-family: 'Courier New', monospace; font-size: 16px; font-weight: bold; }
      .value-unit { fill: #94a3b8; font-family: 'Courier New', monospace; font-size: 10px; }
      .repo-name { fill: #e2e8f0; font-family: 'Courier New', monospace; font-size: 14px; font-weight: bold; }
      .status-text { fill: #4ade80; font-family: 'Courier New', monospace; font-size: 12px; }
      .status-dot { fill: #4ade80; animation: blink 1.5s ease-in-out infinite; }
      .divider { stroke: #2e3238; stroke-width: 1; }
      .bar-bg { fill: #262a30; rx: 3; }
      .bar-fill { fill: #4ade80; rx: 3; opacity: 0.85; }
      .border { fill: none; stroke: #2e3238; stroke-width: 1; rx: 8; }
      .icon { fill: #4ade80; font-size: 14px; }
      .heart { fill: #4ade80; animation: pulse-glow 1s ease-in-out infinite; }
    </style>
  </defs>

  <rect class="bg" width="800" height="220" rx="8"/>
  <rect class="border" x="0.5" y="0.5" width="799" height="219"/>

  <g opacity="0.3">
    <line class="grid-line" x1="0" y1="44" x2="560" y2="44"/>
    <line class="grid-line" x1="0" y1="88" x2="560" y2="88"/>
    <line class="grid-line" x1="0" y1="132" x2="560" y2="132"/>
    <line class="grid-line" x1="0" y1="176" x2="560" y2="176"/>
  </g>

  <path class="ecg-line" d="
    M 0,110
    L 30,110
    L 35,110 L 38,105 L 42,115 L 45,110
    L 65,110
    L 68,110 L 72,108 L 76,110
    L 85,110
    L 88,110 L 90,60 L 94,140 L 96,95 L 100,110
    L 120,110
    L 123,105 L 130,100 L 140,100 L 147,105 L 150,110
    L 180,110
    L 210,110
    L 215,110 L 218,105 L 222,115 L 225,110
    L 245,110
    L 248,110 L 252,108 L 256,110
    L 265,110
    L 268,110 L 270,60 L 274,140 L 276,95 L 280,110
    L 300,110
    L 303,105 L 310,100 L 320,100 L 327,105 L 330,110
    L 360,110
    L 390,110
    L 395,110 L 398,105 L 402,115 L 405,110
    L 425,110
    L 428,110 L 432,108 L 436,110
    L 445,110
    L 448,110 L 450,60 L 454,140 L 456,95 L 460,110
    L 480,110
    L 483,105 L 490,100 L 500,100 L 507,105 L 510,110
    L 540,110
    L 560,110
  "/>

  <line class="divider" x1="580" y1="15" x2="580" y2="205"/>

  <text class="label" x="600" y="35">HR</text>
  <text class="value" x="700" y="35" text-anchor="end">72</text>
  <text class="value-unit" x="706" y="35">bpm</text>

  <text class="label" x="600" y="62">CI</text>
  <text class="value" x="700" y="62" text-anchor="end">PASS</text>
  <text x="710" y="62" class="icon">&#x2713;</text>

  <text class="label" x="600" y="89">PR</text>
  <text class="value" x="700" y="89" text-anchor="end">3.2</text>
  <text class="value-unit" x="706" y="89">hrs</text>

  <text class="label" x="600" y="116">RF</text>
  <text class="value" x="700" y="116" text-anchor="end">2.4</text>
  <text class="value-unit" x="706" y="116">/wk</text>

  <text class="label" x="600" y="143">IR</text>
  <text class="value" x="700" y="143" text-anchor="end">1.8</text>
  <text class="value-unit" x="706" y="143">hrs</text>

  <rect class="bar-bg" x="600" y="160" width="170" height="10"/>
  <rect class="bar-fill" x="600" y="160" width="153" height="10"/>

  <circle class="status-dot" cx="608" cy="185" r="4"/>
  <text class="status-text" x="618" y="189">HEALTHY</text>
  <text class="value" x="770" y="189" text-anchor="end" font-size="13">90</text>
  <text class="value-unit" x="775" y="189">/100</text>

  <text class="repo-name" x="20" y="205">
    <tspan fill="#64748b">owner/</tspan>repo-name
  </text>
  <text class="heart" x="540" y="207" font-size="16">&#x2665;</text>
</svg>
