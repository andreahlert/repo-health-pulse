<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220">
  <defs>
    <style>
      @keyframes flatline-sweep {
        0% { stroke-dashoffset: 1200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes fade-slow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.7; }
      }
      .bg { fill: #1a1c20; }
      .ecg-line {
        fill: none;
        stroke: #6b7280;
        stroke-width: 2;
        stroke-linecap: round;
        filter: drop-shadow(0 0 2px #6b728030);
        stroke-dasharray: 1200;
        animation: flatline-sweep 6s linear infinite;
      }
      .grid-line { stroke: #262a30; stroke-width: 0.5; }
      .label { fill: #6b7280; font-family: 'Courier New', monospace; font-size: 11px; }
      .value { fill: #6b7280; font-family: 'Courier New', monospace; font-size: 16px; font-weight: bold; }
      .value-unit { fill: #4b5563; font-family: 'Courier New', monospace; font-size: 10px; }
      .value-dead { fill: #6b7280; font-family: 'Courier New', monospace; font-size: 16px; }
      .repo-name { fill: #6b7280; font-family: 'Courier New', monospace; font-size: 14px; font-weight: bold; }
      .status-text { fill: #6b7280; font-family: 'Courier New', monospace; font-size: 12px; animation: fade-slow 3s ease-in-out infinite; }
      .status-dot { fill: #6b7280; animation: fade-slow 3s ease-in-out infinite; }
      .divider { stroke: #2e3238; stroke-width: 1; }
      .bar-bg { fill: #262a30; rx: 3; }
      .bar-fill { fill: #4b5563; rx: 3; }
      .border { fill: none; stroke: #2e3238; stroke-width: 1; rx: 8; }
      .heart { fill: #4b5563; }
      .noise {
        fill: none;
        stroke: #374151;
        stroke-width: 0.8;
        stroke-dasharray: 1200;
        animation: flatline-sweep 8s linear infinite;
      }
    </style>
  </defs>

  <rect class="bg" width="800" height="220" rx="8"/>
  <rect class="border" x="0.5" y="0.5" width="799" height="219"/>

  <g opacity="0.15">
    <line class="grid-line" x1="0" y1="44" x2="560" y2="44"/>
    <line class="grid-line" x1="0" y1="88" x2="560" y2="88"/>
    <line class="grid-line" x1="0" y1="132" x2="560" y2="132"/>
    <line class="grid-line" x1="0" y1="176" x2="560" y2="176"/>
  </g>

  <path class="ecg-line" d="
    M 0,110
    L 40,110 L 42,109 L 44,111 L 46,110
    L 90,110 L 92,111 L 94,109 L 96,110
    L 140,110 L 143,109 L 145,111 L 147,110
    L 200,110 L 202,111 L 204,109 L 206,110
    L 260,110 L 263,110 L 265,109 L 267,111 L 269,110
    L 320,110 L 322,111 L 324,109 L 326,110
    L 380,110 L 383,109 L 385,111 L 387,110
    L 440,110 L 442,111 L 444,110
    L 500,110 L 502,109 L 504,111 L 506,110
    L 560,110
  "/>

  <path class="noise" d="
    M 0,110
    L 50,110.5 L 100,109.5 L 150,110.3 L 200,109.7
    L 250,110.4 L 300,109.6 L 350,110.2 L 400,109.8
    L 450,110.3 L 500,109.7 L 560,110
  "/>

  <line class="divider" x1="580" y1="15" x2="580" y2="205"/>

  <text class="label" x="600" y="35">HR</text>
  <text class="value" x="700" y="35" text-anchor="end">--</text>
  <text class="value-unit" x="706" y="35">bpm</text>

  <text class="label" x="600" y="62">CI</text>
  <text class="value-dead" x="700" y="62" text-anchor="end">NONE</text>

  <text class="label" x="600" y="89">PR</text>
  <text class="value-dead" x="700" y="89" text-anchor="end">--</text>
  <text class="value-unit" x="706" y="89">days</text>

  <text class="label" x="600" y="116">RF</text>
  <text class="value-dead" x="700" y="116" text-anchor="end">0.0</text>
  <text class="value-unit" x="706" y="116">/wk</text>

  <text class="label" x="600" y="143">IR</text>
  <text class="value-dead" x="700" y="143" text-anchor="end">--</text>
  <text class="value-unit" x="706" y="143">days</text>

  <rect class="bar-bg" x="600" y="160" width="170" height="10"/>
  <rect class="bar-fill" x="600" y="160" width="9" height="10"/>

  <circle class="status-dot" cx="608" cy="185" r="4"/>
  <text class="status-text" x="618" y="189">FLATLINE</text>
  <text class="value" x="770" y="189" text-anchor="end" font-size="13">5</text>
  <text class="value-unit" x="775" y="189">/100</text>

  <text class="repo-name" x="20" y="205">
    <tspan fill="#4b5563">owner/</tspan>abandoned-project
  </text>
  <text class="heart" x="540" y="207" font-size="16">&#x2665;</text>
</svg>
