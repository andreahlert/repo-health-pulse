<svg xmlns="http://www.w3.org/2000/svg" width="280" height="32" viewBox="0 0 280 32">
  <defs>
    <style>
      @keyframes badge-trace {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes badge-pulse {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
      .badge-bg-left { fill: #1a1c20; }
      .badge-bg-right { fill: #1e2420; }
      .badge-text { fill: #e2e8f0; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 11px; }
      .badge-value { fill: #4ade80; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 11px; font-weight: bold; }
      .badge-ecg {
        fill: none;
        stroke: #4ade80;
        stroke-width: 1.8;
        stroke-linecap: round;
        filter: drop-shadow(0 0 2px #4ade8040);
        stroke-dasharray: 200;
        animation: badge-trace 2s linear infinite;
      }
      .badge-heart { fill: #4ade80; font-size: 10px; animation: badge-pulse 1s ease-in-out infinite; }
    </style>
  </defs>

  <rect class="badge-bg-left" width="90" height="32" rx="4"/>
  <rect class="badge-bg-right" x="90" width="190" height="32" rx="0"/>
  <rect class="badge-bg-right" x="276" width="4" height="32" rx="4"/>
  <rect fill="none" stroke="#2e3238" stroke-width="1" x="0.5" y="0.5" width="279" height="31" rx="4"/>

  <text class="badge-text" x="10" y="20">health</text>

  <path class="badge-ecg" d="
    M 95,16 L 108,16
    L 110,16 L 112,12 L 114,20 L 116,16
    L 124,16
    L 126,16 L 127,6 L 129,26 L 131,13 L 133,16
    L 144,16
    L 146,14 L 150,12 L 154,14 L 156,16
    L 168,16
    L 170,16 L 172,12 L 174,20 L 176,16
    L 184,16
    L 186,16 L 187,6 L 189,26 L 191,13 L 193,16
    L 204,16
    L 206,14 L 210,12 L 214,14 L 216,16
    L 226,16
  "/>

  <text class="badge-value" x="232" y="20">90/100</text>
  <text class="badge-heart" x="268" y="20">&#x2665;</text>
</svg>
