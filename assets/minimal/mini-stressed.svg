<svg xmlns="http://www.w3.org/2000/svg" width="480" height="80" viewBox="0 0 480 80">
  <defs>
    <style>
      @keyframes trace-fast {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulse-warn {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
      .bg { fill: #1a1c20; }
      .ecg {
        fill: none;
        stroke: #eab308;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(0 0 3px #eab30840);
        stroke-dasharray: 1000;
        animation: trace-fast 2.2s linear infinite;
      }
      .repo { fill: #e2e8f0; font-family: 'Courier New', monospace; font-size: 12px; }
      .repo-dim { fill: #64748b; }
      .score { fill: #eab308; font-family: 'Courier New', monospace; font-size: 20px; font-weight: bold; }
      .score-unit { fill: #94a3b8; font-family: 'Courier New', monospace; font-size: 11px; }
      .status { fill: #eab308; font-family: 'Courier New', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
      .dot { fill: #eab308; animation: pulse-warn 0.7s ease-in-out infinite; }
      .border { fill: none; stroke: #2e3238; stroke-width: 1; rx: 6; }
    </style>
  </defs>

  <rect class="bg" width="480" height="80" rx="6"/>
  <rect class="border" x="0.5" y="0.5" width="479" height="79"/>

