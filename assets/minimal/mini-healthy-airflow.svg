<svg xmlns="http://www.w3.org/2000/svg" width="480" height="80" viewBox="0 0 480 80">
  <defs>
    <style>
      @keyframes trace {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      .bg { fill: #1a1c20; }
      .ecg {
        fill: none;
        stroke: #4ade80;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(0 0 3px #4ade8040);
        stroke-dasharray: 1000;
        animation: trace 3.2s linear infinite;
      }
      .repo { fill: #e2e8f0; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 12px; }
      .repo-dim { fill: #64748b; }
      .score { fill: #4ade80; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 20px; font-weight: bold; }
      .score-unit { fill: #94a3b8; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 11px; }
      .status { fill: #4ade80; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
      .dot { fill: #4ade80; animation: pulse 1.5s ease-in-out infinite; }
      .border { fill: none; stroke: #2e3238; stroke-width: 1; rx: 6; }
    </style>
  </defs>

  <rect class="bg" width="480" height="80" rx="6"/>
  <rect class="border" x="0.5" y="0.5" width="479" height="79"/>

  <path class="ecg" d="
    M 15,40
    L 32,40 L 35,40 L 37,36 L 40,44 L 42,40
    L 53,40 L 55,38 L 58,37 L 61,40
    L 68,40 L 70,40 L 72,17 L 75,59 L 77,32 L 80,40
    L 93,40 L 95,37 L 100,34 L 107,34 L 112,37 L 114,40
    L 133,40

    L 150,40 L 153,40 L 155,36 L 158,44 L 160,40
    L 171,40 L 173,38 L 176,37 L 179,40
    L 186,40 L 188,40 L 190,17 L 193,59 L 195,32 L 198,40
    L 211,40 L 213,37 L 218,34 L 225,34 L 230,37 L 232,40
    L 251,40

    L 268,40 L 271,40 L 273,36 L 276,44 L 278,40
    L 289,40 L 291,38 L 294,37 L 297,40
    L 304,40 L 306,40 L 308,17 L 311,59 L 313,32 L 316,40
    L 329,40 L 331,37 L 336,34 L 343,34 L 348,37 L 350,40
    L 369,40 L 385,40
  "/>

  <text class="repo" x="15" y="68">
    <tspan class="repo-dim">apache/</tspan>airflow
  </text>

  <circle class="dot" cx="410" cy="28" r="3"/>
  <text class="status" x="418" y="32">healthy</text>

  <text class="score" x="410" y="58">82</text>
  <text class="score-unit" x="438" y="58">/100</text>
</svg>
