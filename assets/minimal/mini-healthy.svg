<svg xmlns="http://www.w3.org/2000/svg" width="480" height="80" viewBox="0 0 480 80">
  <defs>
    <style>
      @keyframes trace {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      .bg { fill: #1a1c20; }
      .ecg {
        fill: none;
        stroke: #4ade80;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(0 0 3px #4ade8040);
        stroke-dasharray: 1000;
        animation: trace 3.5s linear infinite;
      }
      .repo { fill: #e2e8f0; font-family: 'Courier New', monospace; font-size: 12px; }
      .repo-dim { fill: #64748b; }
      .score { fill: #4ade80; font-family: 'Courier New', monospace; font-size: 20px; font-weight: bold; }
      .score-unit { fill: #94a3b8; font-family: 'Courier New', monospace; font-size: 11px; }
      .status { fill: #4ade80; font-family: 'Courier New', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
      .dot { fill: #4ade80; animation: pulse 1.5s ease-in-out infinite; }
      .border { fill: none; stroke: #2e3238; stroke-width: 1; rx: 6; }
    </style>
  </defs>

  <rect class="bg" width="480" height="80" rx="6"/>
  <rect class="border" x="0.5" y="0.5" width="479" height="79"/>

  <path class="ecg" d="
    M 15,40
    L 35,40
    L 38,40 L 40,36 L 43,44 L 45,40
    L 58,40
    L 60,38 L 63,37 L 66,40
    L 73,40
    L 75,40 L 77,18 L 80,58 L 82,33 L 85,40
    L 98,40
    L 100,37 L 105,34 L 112,34 L 117,37 L 119,40
    L 140,40

    L 160,40
    L 163,40 L 165,36 L 168,44 L 170,40
    L 183,40
    L 185,38 L 188,37 L 191,40
    L 198,40
    L 200,40 L 202,18 L 205,58 L 207,33 L 210,40
    L 223,40
    L 225,37 L 230,34 L 237,34 L 242,37 L 244,40
    L 265,40

    L 285,40
    L 288,40 L 290,36 L 293,44 L 295,40
    L 308,40
    L 310,38 L 313,37 L 316,40
    L 323,40
    L 325,40 L 327,18 L 330,58 L 332,33 L 335,40
    L 348,40
    L 350,37 L 355,34 L 362,34 L 367,37 L 369,40
    L 385,40
  "/>

  <text class="repo" x="15" y="68">
    <tspan class="repo-dim">owner/</tspan>repo-name
  </text>

  <circle class="dot" cx="410" cy="28" r="3"/>
  <text class="status" x="418" y="32">healthy</text>

  <text class="score" x="410" y="58">90</text>
  <text class="score-unit" x="438" y="58">/100</text>
</svg>
