<svg xmlns="http://www.w3.org/2000/svg" width="480" height="80" viewBox="0 0 480 80">
  <defs>
    <style>
      @keyframes flat-sweep {
        0% { stroke-dashoffset: 800; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes fade {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.7; }
      }
      .bg { fill: #1a1c20; }
      .ecg {
        fill: none;
        stroke: #6b7280;
        stroke-width: 1.8;
        stroke-linecap: round;
        filter: drop-shadow(0 0 1px #6b728020);
        stroke-dasharray: 800;
        animation: flat-sweep 5s linear infinite;
      }
      .repo { fill: #6b7280; font-family: 'Courier New', monospace; font-size: 12px; }
      .repo-dim { fill: #4b5563; }
      .score { fill: #6b7280; font-family: 'Courier New', monospace; font-size: 20px; font-weight: bold; }
      .score-unit { fill: #4b5563; font-family: 'Courier New', monospace; font-size: 11px; }
      .status { fill: #6b7280; font-family: 'Courier New', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; animation: fade 3s ease-in-out infinite; }
      .dot { fill: #6b7280; animation: fade 3s ease-in-out infinite; }
      .border { fill: none; stroke: #2e3238; stroke-width: 1; rx: 6; }
    </style>
  </defs>

  <rect class="bg" width="480" height="80" rx="6"/>
  <rect class="border" x="0.5" y="0.5" width="479" height="79"/>

  <path class="ecg" d="
    M 15,40
    L 50,40 L 52,39.5 L 54,40.5 L 56,40
    L 100,40 L 102,40.5 L 104,39.5 L 106,40
    L 150,40 L 152,39.5 L 154,40.5 L 156,40
    L 200,40 L 202,40.5 L 204,39.5 L 206,40
    L 250,40 L 252,39.5 L 254,40.5 L 256,40
    L 300,40 L 302,40.5 L 304,39.5 L 306,40
    L 350,40 L 352,39.5 L 354,40.5 L 356,40
    L 385,40
  "/>

  <text class="repo" x="15" y="68">
    <tspan class="repo-dim">expressjs/</tspan>express
  </text>

  <circle class="dot" cx="410" cy="28" r="3"/>
  <text class="status" x="418" y="32">flatline</text>

  <text class="score" x="410" y="58">15</text>
  <text class="score-unit" x="430" y="58">/100</text>
</svg>
