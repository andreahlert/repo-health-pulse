<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220">
  <defs>
    <style>
      @keyframes trace-erratic {
        0% { stroke-dashoffset: 2400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes blink-crit {
        0%, 100% { opacity: 1; }
        30% { opacity: 0; }
        60% { opacity: 1; }
        80% { opacity: 0; }
      }
      @keyframes pulse-crit {
        0%, 100% { opacity: 0.3; }
        25% { opacity: 1; }
        50% { opacity: 0.3; }
        75% { opacity: 0.9; }
      }
      @keyframes alert-flash {
        0%, 100% { fill: #ef4444; }
        50% { fill: #ef444440; }
      }
      .bg { fill: #1a1c20; }
      .ecg-line {
        fill: none;
        stroke: #ef4444;
        stroke-width: 2.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(0 0 5px #ef444460);
        stroke-dasharray: 2400;
        animation: trace-erratic 3.5s linear infinite;
      }
      .grid-line { stroke: #262a30; stroke-width: 0.5; }
      .label { fill: #ef4444; font-family: 'Courier New', monospace; font-size: 11px; }
      .value { fill: #e2e8f0; font-family: 'Courier New', monospace; font-size: 16px; font-weight: bold; }
      .value-unit { fill: #94a3b8; font-family: 'Courier New', monospace; font-size: 10px; }
      .value-crit { fill: #ef4444; font-family: 'Courier New', monospace; font-size: 16px; font-weight: bold; animation: blink-crit 1.2s ease-in-out infinite; }
      .repo-name { fill: #e2e8f0; font-family: 'Courier New', monospace; font-size: 14px; font-weight: bold; }
      .status-text { fill: #ef4444; font-family: 'Courier New', monospace; font-size: 12px; font-weight: bold; animation: blink-crit 0.6s ease-in-out infinite; }
      .status-dot { animation: alert-flash 0.4s ease-in-out infinite; }
      .divider { stroke: #2e3238; stroke-width: 1; }
      .bar-bg { fill: #262a30; rx: 3; }
      .bar-fill { fill: #ef4444; rx: 3; opacity: 0.85; }
      .border { fill: none; stroke: #ef444430; stroke-width: 1.5; rx: 8; }
      .icon { fill: #ef4444; font-size: 14px; }
      .heart { fill: #ef4444; animation: pulse-crit 0.4s ease-in-out infinite; }
    </style>
  </defs>

  <rect class="bg" width="800" height="220" rx="8"/>
  <rect width="800" height="220" rx="8" fill="#ef4444" opacity="0.02"/>
  <rect class="border" x="0.5" y="0.5" width="799" height="219"/>

  <g opacity="0.3">
    <line class="grid-line" x1="0" y1="44" x2="560" y2="44"/>
    <line class="grid-line" x1="0" y1="88" x2="560" y2="88"/>
    <line class="grid-line" x1="0" y1="132" x2="560" y2="132"/>
    <line class="grid-line" x1="0" y1="176" x2="560" y2="176"/>
  </g>

  <path class="ecg-line" d="
    M 0,110
    L 20,110
    L 23,110 L 25,100 L 29,120 L 31,110
    L 38,110
    L 40,108 L 43,105 L 46,110
    L 52,110
    L 54,110 L 56,40 L 60,160 L 62,80 L 65,110
    L 78,110
    L 80,102 L 85,96 L 92,96 L 97,102 L 99,110
    L 108,110
    L 140,110
    L 142,110 L 143,104 L 146,116 L 147,110
    L 152,110
    L 154,110 L 156,35 L 160,165 L 162,75 L 165,115 L 167,105 L 170,110
    L 183,110
    L 185,103 L 189,98 L 194,98 L 199,103 L 201,110
    L 210,110
    L 220,112
    L 224,108 L 228,114 L 232,106 L 236,116 L 240,108 L 244,112
    L 252,110
    L 254,110 L 256,45 L 260,155 L 262,82 L 265,110
    L 280,110
    L 283,104 L 287,99 L 293,99 L 298,104 L 300,110
    L 320,110
    L 360,110
    L 363,110 L 364,102 L 368,118 L 370,110
    L 378,110
    L 380,107 L 383,104 L 386,110
    L 392,110
    L 394,110 L 396,38 L 400,162 L 402,78 L 405,112 L 407,106 L 410,110
    L 425,110
    L 427,103 L 432,97 L 438,97 L 443,103 L 445,110
    L 455,110
    L 465,113
    L 468,107 L 472,115 L 476,105 L 480,118 L 484,107 L 488,112
    L 495,110
    L 497,110 L 499,42 L 503,158 L 505,83 L 508,110
    L 525,110
    L 560,110
  "/>

  <line class="divider" x1="580" y1="15" x2="580" y2="205"/>

  <text class="label" x="600" y="35">HR</text>
  <text class="value-crit" x="700" y="35" text-anchor="end">128</text>
  <text class="value-unit" x="706" y="35">bpm</text>

  <text class="label" x="600" y="62">CI</text>
  <text class="value-crit" x="700" y="62" text-anchor="end">FAIL</text>
  <text x="710" y="62" class="icon">&#x2717;</text>

  <text class="label" x="600" y="89">PR</text>
  <text class="value" x="700" y="89" text-anchor="end">4.2</text>
  <text class="value-unit" x="706" y="89">days</text>

  <text class="label" x="600" y="116">RF</text>
  <text class="value" x="700" y="116" text-anchor="end">0.2</text>
  <text class="value-unit" x="706" y="116">/wk</text>

  <text class="label" x="600" y="143">IR</text>
  <text class="value" x="700" y="143" text-anchor="end">5.1</text>
  <text class="value-unit" x="706" y="143">days</text>

  <rect class="bar-bg" x="600" y="160" width="170" height="10"/>
  <rect class="bar-fill" x="600" y="160" width="51" height="10"/>

  <circle class="status-dot" cx="608" cy="185" r="4"/>
  <text class="status-text" x="618" y="189">CRITICAL</text>
  <text class="value" x="770" y="189" text-anchor="end" font-size="13">30</text>
  <text class="value-unit" x="775" y="189">/100</text>

  <text class="repo-name" x="20" y="205">
    <tspan fill="#64748b">owner/</tspan>payment-service
  </text>
  <text class="heart" x="540" y="207" font-size="16">&#x2665;</text>
</svg>
