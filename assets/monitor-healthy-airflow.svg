<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220">
  <defs>
    <style>
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      @keyframes trace {
        0% { stroke-dashoffset: 2400; }
        100% { stroke-dashoffset: 0; }
      }
      .bg { fill: #1a1c20; }
      .ecg-line {
        fill: none;
        stroke: #4ade80;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(0 0 4px #4ade8050);
        stroke-dasharray: 2400;
        animation: trace 3.6s linear infinite;
      }
      .grid-line { stroke: #262a30; stroke-width: 0.5; }
      .label { fill: #94a3b8; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
      .value { fill: #e2e8f0; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 15px; font-weight: bold; }
      .value-unit { fill: #64748b; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 10px; }
      .value-good { fill: #4ade80; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 15px; font-weight: bold; }
      .value-ok { fill: #e2e8f0; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 15px; font-weight: bold; }
      .repo-name { fill: #e2e8f0; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 14px; font-weight: bold; }
      .status-text { fill: #4ade80; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 12px; font-weight: bold; }
      .status-dot { fill: #4ade80; animation: blink 1.5s ease-in-out infinite; }
      .divider { stroke: #2e3238; stroke-width: 1; }
      .bar-bg { fill: #262a30; rx: 3; }
      .bar-fill { fill: #4ade80; rx: 3; opacity: 0.85; }
      .border { fill: none; stroke: #2e3238; stroke-width: 1; rx: 8; }
      .heart { fill: #4ade80; animation: pulse-glow 1s ease-in-out infinite; font-size: 18px; }
      .bpm { fill: #4ade80; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 22px; font-weight: bold; }
      .bpm-unit { fill: #4ade8099; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 10px; }
    </style>
  </defs>

  <rect class="bg" width="800" height="220" rx="8"/>
  <rect class="border" x="0.5" y="0.5" width="799" height="219"/>

  <g opacity="0.3">
    <line class="grid-line" x1="0" y1="44" x2="555" y2="44"/>
    <line class="grid-line" x1="0" y1="88" x2="555" y2="88"/>
    <line class="grid-line" x1="0" y1="132" x2="555" y2="132"/>
    <line class="grid-line" x1="0" y1="176" x2="555" y2="176"/>
  </g>

  <!-- ECG Waveform - Normal Sinus, slightly elevated (76 bpm) -->
  <path class="ecg-line" d="
    M 0,110
    L 25,110 L 29,110 L 32,105 L 36,115 L 39,110
    L 55,110 L 58,110 L 62,108 L 66,110
    L 74,110 L 77,110 L 79,58 L 83,142 L 85,93 L 89,110
    L 106,110 L 109,105 L 115,100 L 124,100 L 130,105 L 133,110
    L 160,110

    L 185,110 L 189,110 L 192,105 L 196,115 L 199,110
    L 215,110 L 218,110 L 222,108 L 226,110
    L 234,110 L 237,110 L 239,58 L 243,142 L 245,93 L 249,110
    L 266,110 L 269,105 L 275,100 L 284,100 L 290,105 L 293,110
    L 320,110

    L 345,110 L 349,110 L 352,105 L 356,115 L 359,110
    L 375,110 L 378,110 L 382,108 L 386,110
    L 394,110 L 397,110 L 399,58 L 403,142 L 405,93 L 409,110
    L 426,110 L 429,105 L 435,100 L 444,100 L 450,105 L 453,110
    L 480,110

    L 505,110 L 509,110 L 512,105 L 516,115 L 519,110
    L 535,110 L 538,110 L 542,108 L 546,110
    L 555,110
  "/>

  <line class="divider" x1="570" y1="10" x2="570" y2="210"/>

  <!-- BPM -->
  <text class="heart" x="585" y="33">&#x2665;</text>
  <text class="bpm" x="605" y="33">76</text>
  <text class="bpm-unit" x="638" y="33">bpm</text>

  <!-- CI Pass Rate -->
  <text class="label" x="585" y="62">ci pass rate</text>
  <text class="value-good" x="780" y="62" text-anchor="end">100%</text>

  <!-- PR Merge Time -->
  <text class="label" x="585" y="88">pr merge time</text>
  <text class="value" x="757" y="88" text-anchor="end">6.5</text>
  <text class="value-unit" x="762" y="88">hrs</text>

  <!-- Release Frequency -->
  <text class="label" x="585" y="114">releases</text>
  <text class="value" x="757" y="114" text-anchor="end">0.51</text>
  <text class="value-unit" x="762" y="114">/wk</text>

  <!-- Issue Response Time -->
  <text class="label" x="585" y="140">response time</text>
  <text class="value" x="757" y="140" text-anchor="end">3.5</text>
  <text class="value-unit" x="762" y="140">hrs</text>

  <!-- Health Bar -->
  <rect class="bar-bg" x="585" y="158" width="195" height="8"/>
  <rect class="bar-fill" x="585" y="158" width="160" height="8"/>

  <!-- Status -->
  <circle class="status-dot" cx="593" cy="183" r="3.5"/>
  <text class="status-text" x="603" y="187">HEALTHY</text>
  <text class="value" x="757" y="187" text-anchor="end">82</text>
  <text class="value-unit" x="762" y="187">/100</text>

  <!-- Repo Name -->
  <text class="repo-name" x="20" y="205">
    <tspan fill="#64748b">apache/</tspan>airflow
  </text>
</svg>
