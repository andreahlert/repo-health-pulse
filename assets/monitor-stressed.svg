<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220">
  <defs>
    <style>
      @keyframes trace-fast {
        0% { stroke-dashoffset: 2400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes blink-warn {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      @keyframes pulse-warn {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
      .bg { fill: #1a1c20; }
      .ecg-line {
        fill: none;
        stroke: #eab308;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(0 0 4px #eab30850);
        stroke-dasharray: 2400;
        animation: trace-fast 2.5s linear infinite;
      }
      .grid-line { stroke: #262a30; stroke-width: 0.5; }
      .label { fill: #eab308; font-family: 'Courier New', monospace; font-size: 11px; }
      .value { fill: #e2e8f0; font-family: 'Courier New', monospace; font-size: 16px; font-weight: bold; }
      .value-unit { fill: #94a3b8; font-family: 'Courier New', monospace; font-size: 10px; }
      .value-warn { fill: #f59e0b; font-family: 'Courier New', monospace; font-size: 16px; font-weight: bold; }
      .repo-name { fill: #e2e8f0; font-family: 'Courier New', monospace; font-size: 14px; font-weight: bold; }
      .status-text { fill: #eab308; font-family: 'Courier New', monospace; font-size: 12px; }
      .status-dot { fill: #eab308; animation: blink-warn 0.8s ease-in-out infinite; }
      .divider { stroke: #2e3238; stroke-width: 1; }
      .bar-bg { fill: #262a30; rx: 3; }
      .bar-fill { fill: #eab308; rx: 3; opacity: 0.85; }
      .border { fill: none; stroke: #2e3238; stroke-width: 1; rx: 8; }
      .icon { fill: #f59e0b; font-size: 14px; }
      .heart { fill: #eab308; animation: pulse-warn 0.6s ease-in-out infinite; }
    </style>
  </defs>

  <rect class="bg" width="800" height="220" rx="8"/>
  <rect class="border" x="0.5" y="0.5" width="799" height="219"/>

  <g opacity="0.3">
    <line class="grid-line" x1="0" y1="44" x2="560" y2="44"/>
    <line class="grid-line" x1="0" y1="88" x2="560" y2="88"/>
    <line class="grid-line" x1="0" y1="132" x2="560" y2="132"/>
    <line class="grid-line" x1="0" y1="176" x2="560" y2="176"/>
  </g>

  <path class="ecg-line" d="
    M 0,110
    L 15,110
    L 18,110 L 20,103 L 24,117 L 26,110
    L 36,110
    L 38,108 L 41,106 L 44,110
    L 50,110
    L 52,110 L 54,50 L 58,150 L 60,88 L 63,110
    L 73,110
    L 75,100 L 80,92 L 86,92 L 91,100 L 93,110
    L 110,110
    L 125,110
    L 128,110 L 130,103 L 134,117 L 136,110
    L 146,110
    L 148,108 L 151,106 L 154,110
    L 160,110
    L 162,110 L 164,50 L 168,150 L 170,88 L 173,110
    L 183,110
    L 185,100 L 190,92 L 196,92 L 201,100 L 203,110
    L 220,110
    L 235,110
    L 238,110 L 240,103 L 244,117 L 246,110
    L 256,110
    L 258,108 L 261,106 L 264,110
    L 270,110
    L 272,110 L 274,50 L 278,150 L 280,88 L 283,110
    L 293,110
    L 295,100 L 300,92 L 306,92 L 311,100 L 313,110
    L 330,110
    L 345,110
    L 348,110 L 350,103 L 354,117 L 356,110
    L 366,110
    L 368,108 L 371,106 L 374,110
    L 380,110
    L 382,110 L 384,50 L 388,150 L 390,88 L 393,110
    L 403,110
    L 405,100 L 410,92 L 416,92 L 421,100 L 423,110
    L 440,110
    L 455,110
    L 458,110 L 460,103 L 464,117 L 466,110
    L 476,110
    L 478,108 L 481,106 L 484,110
    L 490,110
    L 492,110 L 494,50 L 498,150 L 500,88 L 503,110
    L 513,110
    L 515,100 L 520,92 L 526,92 L 531,100 L 533,110
    L 560,110
  "/>

  <line class="divider" x1="580" y1="15" x2="580" y2="205"/>

  <text class="label" x="600" y="35">HR</text>
  <text class="value" x="700" y="35" text-anchor="end">96</text>
  <text class="value-unit" x="706" y="35">bpm</text>

  <text class="label" x="600" y="62">CI</text>
  <text class="value-warn" x="700" y="62" text-anchor="end">FLAKY</text>
  <text x="710" y="62" class="icon">&#x26A0;</text>

  <text class="label" x="600" y="89">PR</text>
  <text class="value-warn" x="700" y="89" text-anchor="end">18.5</text>
  <text class="value-unit" x="706" y="89">hrs</text>

  <text class="label" x="600" y="116">RF</text>
  <text class="value" x="700" y="116" text-anchor="end">0.8</text>
  <text class="value-unit" x="706" y="116">/wk</text>

  <text class="label" x="600" y="143">IR</text>
  <text class="value-warn" x="700" y="143" text-anchor="end">26.3</text>
  <text class="value-unit" x="706" y="143">hrs</text>

  <rect class="bar-bg" x="600" y="160" width="170" height="10"/>
  <rect class="bar-fill" x="600" y="160" width="112" height="10"/>

  <circle class="status-dot" cx="608" cy="185" r="4"/>
  <text class="status-text" x="618" y="189">STRESSED</text>
  <text class="value" x="770" y="189" text-anchor="end" font-size="13">66</text>
  <text class="value-unit" x="775" y="189">/100</text>

  <text class="repo-name" x="20" y="205">
    <tspan fill="#64748b">owner/</tspan>legacy-api
  </text>
  <text class="heart" x="540" y="207" font-size="16">&#x2665;</text>
</svg>
