<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repo Detail - Repovital</title>
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { margin: 0; padding: 0; min-height: 100vh; overflow: auto; font-size: 15px; }

    /* ── Top bar (sticky, 48px) ──────────────────────── */
    .detail-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1rem;
      border-bottom: 1px solid var(--border);
      height: 48px;
      box-sizing: border-box;
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
    }
    .back-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }
    .back-link:hover { color: var(--text); }
    .detail-header-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .detail-avatar {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: var(--bg-input);
    }
    .repo-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }
    .repo-title a { color: var(--text); text-decoration: none; }
    .repo-title a:hover { color: var(--accent); }

    /* ── Single column layout ────────────────────────── */
    .detail-wrapper {
      width: 100%;
      max-width: 100%;
      padding: 0.5rem 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    /* ── Full monitor SVG ──────────────────────────── */
    .detail-monitor {
      background: #1a1c20;
      border-radius: 10px;
      overflow: hidden;
      line-height: 0;
      border: 1px solid #2e3238;
    }
    .detail-monitor img {
      width: 100%;
      display: block;
    }

    /* ── Info strip ──────────────────────────────────── */
    .info-strip {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.5rem 0.75rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      flex-wrap: wrap;
    }
    .score-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 1.15rem;
      font-weight: 700;
      flex-shrink: 0;
    }
    .state-label {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .strip-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 400px;
    }
    .strip-sep {
      width: 1px;
      height: 20px;
      background: var(--border);
      flex-shrink: 0;
    }
    .strip-stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }
    .strip-stat-val {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
    }
    .strip-stat-lbl {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
    }
    .strip-tags {
      display: flex;
      gap: 0.3rem;
      flex-wrap: wrap;
    }
    .strip-tag {
      font-size: 0.75rem;
      font-family: var(--font-mono);
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
      background: #262a30;
      color: var(--text-muted);
    }
    .strip-tag.topic {
      background: #1e2a20;
      color: #4ade80;
    }

    /* ── Metrics row (4 cards) ───────────────────────── */
    .metrics-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
    }
    .metric-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem 0.65rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .metric-card-name {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
      font-weight: 600;
    }
    .metric-card-value {
      font-family: var(--font-mono);
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text);
    }
    .metric-bar-track {
      width: 100%;
      height: 5px;
      background: #1e2025;
      border-radius: 3px;
      overflow: hidden;
    }
    .metric-bar-fill {
      height: 100%;
      border-radius: 3px;
    }
    .metric-score-num {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* ── Unified comparison section ──────────────────── */
    .comparison-section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 0.75rem;
    }
    .comparison-section h3 {
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text);
    }
    .comp-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.4rem;
    }
    .comp-row:last-child { margin-bottom: 0; }
    .comp-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      font-weight: 600;
      width: 50px;
      flex-shrink: 0;
    }
    .comp-track {
      flex: 1;
      height: 14px;
      background: #1e2025;
      border-radius: 4px;
      position: relative;
      overflow: visible;
    }
    .comp-marker {
      position: absolute;
      top: -2px;
      width: 3px;
      height: 18px;
      border-radius: 2px;
      transform: translateX(-50%);
    }
    .comp-marker.pop { background: #475569; }
    .comp-marker.cohort { background: #64748b; border: 1px dashed #94a3b8; }
    .comp-marker.repo-mk { border-radius: 50%; width: 10px; height: 10px; top: 2px; }
    .comp-marker-label {
      position: absolute;
      top: -14px;
      font-size: 0.55rem;
      color: var(--text-dim);
      transform: translateX(-50%);
      white-space: nowrap;
    }
    .comp-pct-text {
      font-size: 0.75rem;
      color: var(--text-muted);
      width: 190px;
      flex-shrink: 0;
      text-align: right;
    }
    .comp-legend {
      display: flex;
      gap: 1rem;
      margin-bottom: 0.5rem;
      font-size: 0.7rem;
      color: var(--text-dim);
    }
    .comp-legend-item {
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    .comp-legend-swatch {
      width: 10px;
      height: 10px;
      border-radius: 2px;
    }

    /* ── ECG section (compact) ───────────────────────── */
    .ecg-section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem 0.75rem;
    }
    .ecg-section h3 {
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
      color: var(--text);
    }
    .ecg-findings { display: flex; flex-direction: column; gap: 0.2rem; }
    .ecg-finding {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      line-height: 1.3;
      color: var(--text-muted);
    }
    .ecg-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

    /* ── Loading / Error ─────────────────────────────── */
    .detail-loading, .detail-error { text-align: center; padding: 4rem 2rem; color: var(--text-dim); }
    .detail-error { color: var(--critical); }

    /* ── Responsive ───────────────────────────────────── */
    @media (max-width: 900px) {
      .metrics-row { grid-template-columns: repeat(2, 1fr); }
      .info-strip { gap: 0.5rem; }
      .strip-desc { max-width: 200px; }
      .comp-pct-text { width: 140px; font-size: 0.7rem; }
    }
    @media (max-width: 560px) {
      .metrics-row { grid-template-columns: 1fr; }
      .comp-pct-text { display: none; }
    }
  </style>
</head>
<body>
  <div class="detail-header">
    <a href="/repo-health-pulse/monitor/" class="back-link">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 12L6 8l4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back
    </a>
    <div class="detail-header-right">
      <img id="detail-avatar" class="detail-avatar" src="" alt="" style="display:none">
      <span class="repo-title" id="repo-title">Loading...</span>
    </div>
  </div>

  <div id="detail-root">
    <div class="detail-loading">Loading repo data...</div>
  </div>

  <script>
  (function () {
    "use strict";

    /* ── Helpers ─────────────────────────────────────── */
    function getParam(name) {
      var url = new URL(window.location.href);
      return url.searchParams.get(name);
    }

    function slug(repo) { return repo.replace("/", "-"); }
    function owner(repo) { return repo.split("/")[0]; }

    function formatStars(n) {
      if (n >= 1000) return (n / 1000).toFixed(n >= 100000 ? 0 : 1) + "k";
      return String(n);
    }

    function formatHours(h) {
      if (h == null || isNaN(h)) return "N/A";
      if (h < 1) return "<1h";
      if (h < 24) return h.toFixed(1) + "h";
      return (h / 24).toFixed(1) + "d";
    }

    function formatAge(days) {
      if (days < 365) return days + "d";
      return (days / 365).toFixed(1) + "y";
    }

    function formatSize(kb) {
      if (kb < 1024) return kb + " KB";
      if (kb < 1024 * 1024) return (kb / 1024).toFixed(1) + " MB";
      return (kb / (1024 * 1024)).toFixed(1) + " GB";
    }

    function scoreColor(score) {
      if (score >= 65) return "#4ade80";
      if (score >= 40) return "#eab308";
      return "#ef4444";
    }

    function stateColor(state) {
      var map = { healthy: "#4ade80", stressed: "#eab308", critical: "#ef4444", flatline: "#6b7280" };
      return map[state] || "#6b7280";
    }

    function stateLabel(state) {
      return state.charAt(0).toUpperCase() + state.slice(1);
    }

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    /* ── Cohort logic ───────────────────────────────── */
    function getCohort(size_kb) {
      if (size_kb < 10240) return { name: "tiny (<10 MB)", ci: 55, pr: 84, rel: 0 };
      if (size_kb < 102400) return { name: "medium (10-100 MB)", ci: 80, pr: 21, rel: 0 };
      if (size_kb < 512000) return { name: "big (100-500 MB)", ci: 80, pr: 17, rel: 0.31 };
      return { name: "huge (500 MB+)", ci: 70, pr: 18, rel: 0.31 };
    }

    /* ── Population medians ──────────────────────────── */
    var POP_MEDIANS = { ci: 75, pr: 28, rel: 0.1 };

    /* ── Percentile scoring (0-100) ─────────────────── */
    function ciPercentile(val) {
      if (val == null) return 0;
      return Math.min(100, Math.round(val));
    }

    function prPercentile(val) {
      if (val == null) return 0;
      if (val <= 0) return 100;
      return Math.round(Math.min(100, Math.max(0, 100 - (val / 168) * 100)));
    }

    function relPercentile(val) {
      if (val == null || val === 0) return 0;
      return Math.round(Math.min(100, (val / 3) * 100));
    }

    function responsePercentile(val) {
      if (val == null) return null;
      if (val <= 0) return 100;
      return Math.round(Math.min(100, Math.max(0, 100 - (val / 72) * 100)));
    }

    /* ── Compute percentile rank within a population ── */
    function percentileRank(value, allValues, lowerIsBetter) {
      if (value == null || allValues.length === 0) return null;
      var below = 0;
      for (var i = 0; i < allValues.length; i++) {
        if (lowerIsBetter) {
          if (allValues[i] > value) below++;
        } else {
          if (allValues[i] < value) below++;
        }
      }
      return Math.round((below / allValues.length) * 100);
    }

    /* ── ECG findings ───────────────────────────────── */
    function getEcgFindings(repo) {
      var findings = [];

      if (repo.ci != null && repo.ci < 35) {
        findings.push({ color: "#ef4444", text: "P-wave absent: very low CI pass rate (" + repo.ci + "%), indicating pipeline failure." });
      } else if (repo.ci != null && repo.ci < 60) {
        findings.push({ color: "#eab308", text: "P-wave diminished: moderate CI pass rate (" + repo.ci + "%), intermittent build failures." });
      } else if (repo.ci == null) {
        findings.push({ color: "#6b7280", text: "P-wave absent: no CI data available." });
      }

      if (repo.pr_hours != null && repo.pr_hours > 168) {
        findings.push({ color: "#ef4444", text: "T-wave inverted: extremely slow PR merges (" + formatHours(repo.pr_hours) + "), severe review backlog." });
      } else if (repo.pr_hours != null && repo.pr_hours > 72) {
        findings.push({ color: "#eab308", text: "T-wave flattened: slow PR merge time (" + formatHours(repo.pr_hours) + ")." });
      } else if (repo.pr_hours == null || repo.pr_count === 0) {
        findings.push({ color: "#6b7280", text: "QRS absent: no recent PR activity detected." });
      }

      if (repo.releases_per_week === 0) {
        findings.push({ color: "#eab308", text: "Bradycardia: no releases in the past 90 days." });
      }

      if (repo.response_hours != null && repo.response_hours > 168) {
        findings.push({ color: "#ef4444", text: "Baseline wander: issue response time exceeds one week (" + formatHours(repo.response_hours) + ")." });
      } else if (repo.response_hours != null && repo.response_hours > 48) {
        findings.push({ color: "#eab308", text: "Noisy baseline: slow issue response (" + formatHours(repo.response_hours) + ")." });
      }

      if (repo.score < 25) {
        findings.push({ color: "#ef4444", text: "Flatline pattern: minimal vital signs, project may be abandoned." });
      }

      return findings;
    }

    /* ── Bar position helpers for comparison ──────── */
    function ciBarPos(val) {
      if (val == null) return 0;
      return clamp(val, 0, 100);
    }

    function prBarPos(val) {
      if (val == null || val <= 0) return 0;
      var logVal = Math.log10(val + 1);
      var logMax = Math.log10(721); // 30 days
      return clamp((logVal / logMax) * 100, 0, 100);
    }

    function relBarPos(val) {
      if (val == null) return 0;
      return clamp((val / 3) * 100, 0, 100);
    }

    function barColorForScore(pct) {
      if (pct >= 65) return "#4ade80";
      if (pct >= 40) return "#eab308";
      return "#ef4444";
    }

    /* ── Render unified comparison section ──────────── */
    function renderComparison(repo, cohort, allRepos) {
      var codeRepos = allRepos.filter(function(r) { return !r.type || r.type === "code"; });
      var ciValues = codeRepos.map(function(r) { return r.ci; }).filter(function(v) { return v != null; });
      var prValues = codeRepos.map(function(r) { return r.pr_hours; }).filter(function(v) { return v != null; });
      var relValues = codeRepos.map(function(r) { return r.releases_per_week; }).filter(function(v) { return v != null; });

      var metrics = [
        {
          name: "CI",
          repoVal: repo.ci,
          popMedian: POP_MEDIANS.ci,
          cohortMedian: cohort.ci,
          posFn: ciBarPos,
          formatFn: function(v) { return v != null ? v + "%" : "N/A"; },
          scorePct: ciPercentile(repo.ci),
          pctRank: percentileRank(repo.ci, ciValues, false),
          lowerBetter: false
        },
        {
          name: "PR",
          repoVal: repo.pr_hours,
          popMedian: POP_MEDIANS.pr,
          cohortMedian: cohort.pr,
          posFn: prBarPos,
          formatFn: function(v) { return formatHours(v); },
          scorePct: prPercentile(repo.pr_hours),
          pctRank: percentileRank(repo.pr_hours, prValues, true),
          lowerBetter: true
        },
        {
          name: "REL",
          repoVal: repo.releases_per_week,
          popMedian: POP_MEDIANS.rel,
          cohortMedian: cohort.rel,
          posFn: relBarPos,
          formatFn: function(v) { return v != null ? v.toFixed(2) + "/wk" : "0/wk"; },
          scorePct: relPercentile(repo.releases_per_week),
          pctRank: percentileRank(repo.releases_per_week, relValues, false),
          lowerBetter: false
        }
      ];

      // Add RESP only if data exists
      if (repo.response_hours != null) {
        var respValues = codeRepos.map(function(r) { return r.response_hours; }).filter(function(v) { return v != null; });
        metrics.push({
          name: "RESP",
          repoVal: repo.response_hours,
          popMedian: 48,
          cohortMedian: 48,
          posFn: function(v) {
            if (v == null || v <= 0) return 0;
            var logVal = Math.log10(v + 1);
            var logMax = Math.log10(721);
            return clamp((logVal / logMax) * 100, 0, 100);
          },
          formatFn: function(v) { return formatHours(v); },
          scorePct: responsePercentile(repo.response_hours),
          pctRank: percentileRank(repo.response_hours, respValues, true),
          lowerBetter: true
        });
      }

      var html = '<div class="comparison-section"><h3>Metric Comparison</h3>';
      html += '<div class="comp-legend">' +
        '<span class="comp-legend-item"><span class="comp-legend-swatch" style="background:#475569"></span> Population median</span>' +
        '<span class="comp-legend-item"><span class="comp-legend-swatch" style="background:#64748b;border:1px dashed #94a3b8"></span> Cohort median</span>' +
        '<span class="comp-legend-item"><span class="comp-legend-swatch" style="background:#4ade80;border-radius:50%"></span> This repo</span>' +
      '</div>';

      metrics.forEach(function(m) {
        var popPos = m.posFn(m.popMedian);
        var cohortPos = m.posFn(m.cohortMedian);
        var repoPos = m.posFn(m.repoVal);
        var repoColor = barColorForScore(m.scorePct);

        var pctText = "";
        if (m.pctRank !== null) {
          pctText = m.lowerBetter
            ? "faster than " + m.pctRank + "% of cohort"
            : "better than " + m.pctRank + "% of cohort";
        }

        html += '<div class="comp-row">' +
          '<span class="comp-label">' + m.name + '</span>' +
          '<div class="comp-track">' +
            '<div class="comp-marker pop" style="left:' + popPos + '%"></div>' +
            '<div class="comp-marker cohort" style="left:' + cohortPos + '%"></div>' +
            '<div class="comp-marker repo-mk" style="left:' + repoPos + '%;background:' + repoColor + '"></div>' +
          '</div>' +
          '<span class="comp-pct-text">' + pctText + '</span>' +
        '</div>';
      });

      html += '</div>';
      return html;
    }

    /* ── Render ──────────────────────────────────────── */
    function renderDetail(repo, allRepos) {
      var root = document.getElementById("detail-root");
      var cohort = getCohort(repo.size_kb);
      var sc = stateColor(repo.state);
      var o = owner(repo.repo);

      /* Avatar */
      var avatarEl = document.getElementById("detail-avatar");
      avatarEl.src = "https://github.com/" + o + ".png?size=64";
      avatarEl.style.display = "block";

      /* Title */
      document.getElementById("repo-title").innerHTML =
        '<a href="https://github.com/' + repo.repo + '" target="_blank" rel="noopener">' + repo.repo + '</a>';
      document.title = repo.repo + " - Repovital";

      /* Metrics data */
      var metrics = [
        {
          name: "CI Pass Rate",
          raw: repo.ci != null ? repo.ci + "%" : "N/A",
          percentile: ciPercentile(repo.ci)
        },
        {
          name: "PR Merge Time",
          raw: formatHours(repo.pr_hours),
          percentile: prPercentile(repo.pr_hours)
        },
        {
          name: "Release Freq",
          raw: repo.releases_per_week != null ? repo.releases_per_week.toFixed(2) + "/wk" : "0/wk",
          percentile: relPercentile(repo.releases_per_week)
        },
        {
          name: "Issue Response",
          raw: repo.response_hours != null ? formatHours(repo.response_hours) : "N/A",
          percentile: responsePercentile(repo.response_hours)
        }
      ];

      var html = '<div class="detail-wrapper">';

      /* ── Full monitor SVG (hero) ──────────────────── */
      var monitorSlug = slug(repo.repo);
      html += '<div class="detail-monitor">';
      html += '<img src="full/' + monitorSlug + '.svg" alt="' + repo.repo + ' health monitor" onerror="this.parentElement.style.display=\'none\'">';
      html += '</div>';

      /* ── Info strip ──────────────────────────────── */
      html += '<div class="info-strip">';
      html += '<div class="score-circle" style="background:' + sc + '22;color:' + sc + ';border:2px solid ' + sc + '">' + repo.score + '</div>';
      html += '<span class="state-label" style="color:' + sc + '">' + stateLabel(repo.state) + '</span>';

      if (repo.description) {
        html += '<span class="strip-sep"></span>';
        html += '<span class="strip-desc" title="' + (repo.description || '').replace(/"/g, '&quot;') + '">' + repo.description + '</span>';
      }

      html += '<span class="strip-sep"></span>';

      var infoItems = [
        { val: formatStars(repo.stars) + " \u2605", lbl: "Stars" },
        { val: repo.language || "?", lbl: "Lang" },
        { val: formatSize(repo.size_kb), lbl: "Size" },
        { val: formatAge(repo.age_days), lbl: "Age" },
        { val: (repo.forks ? formatStars(repo.forks) : "?"), lbl: "Forks" },
        { val: cohort.name, lbl: "Cohort" }
      ];
      infoItems.forEach(function(item) {
        html += '<div class="strip-stat"><span class="strip-stat-val">' + item.val + '</span><span class="strip-stat-lbl">' + item.lbl + '</span></div>';
      });

      /* Languages tags */
      if (repo.languages && repo.languages.length > 0) {
        html += '<span class="strip-sep"></span><div class="strip-tags">';
        repo.languages.forEach(function(l) {
          html += '<span class="strip-tag">' + l.lang + ' ' + l.pct + '%</span>';
        });
        html += '</div>';
      }

      /* Topics tags */
      if (repo.topics && repo.topics.length > 0) {
        html += '<span class="strip-sep"></span><div class="strip-tags">';
        repo.topics.slice(0, 8).forEach(function(t) {
          html += '<span class="strip-tag topic">' + t + '</span>';
        });
        html += '</div>';
      }

      html += '</div>'; /* close info-strip */

      /* ── Metrics row (4 cards) ───────────────────── */
      html += '<div class="metrics-row">';
      metrics.forEach(function (m) {
        var pct = m.percentile;
        var barColor = pct == null ? "#6b7280" : (pct >= 65 ? "#4ade80" : (pct >= 40 ? "#eab308" : "#ef4444"));
        var barWidth = pct != null ? pct : 0;

        // Hide RESP card if null
        if (m.name === "Issue Response" && pct === null) {
          html += '<div class="metric-card" style="opacity:0.4">' +
            '<span class="metric-card-name">' + m.name + '</span>' +
            '<span class="metric-card-value">N/A</span>' +
          '</div>';
          return;
        }

        html += '<div class="metric-card">' +
          '<span class="metric-card-name">' + m.name + '</span>' +
          '<span class="metric-card-value">' + m.raw + '</span>' +
          '<div class="metric-bar-track"><div class="metric-bar-fill" style="width:' + barWidth + '%;background:' + barColor + '"></div></div>' +
          '<span class="metric-score-num">' + (pct != null ? pct + "/100" : "N/A") + '</span>' +
        '</div>';
      });
      html += '</div>';

      /* ── Comparison section (merged) ─────────────── */
      html += renderComparison(repo, cohort, allRepos);

      /* ── ECG section (only if findings) ──────────── */
      var findings = getEcgFindings(repo);
      if (findings.length > 0) {
        html += '<div class="ecg-section"><h3>ECG Analysis</h3><div class="ecg-findings">';
        findings.forEach(function (f) {
          html += '<div class="ecg-finding"><span class="ecg-dot" style="background:' + f.color + '"></span><span>' + f.text + '</span></div>';
        });
        html += '</div></div>';
      }

      html += '</div>'; /* close detail-wrapper */
      root.innerHTML = html;
    }

    /* ── Init ────────────────────────────────────────── */
    var repoName = getParam("repo");
    if (!repoName) {
      document.getElementById("detail-root").innerHTML =
        '<div class="detail-error">No repo specified. <a href="/repo-health-pulse/monitor/" style="color:var(--accent)">Go back to the mosaic.</a></div>';
      return;
    }

    fetch("repos.json")
      .then(function (res) {
        if (!res.ok) throw new Error("Failed to load repos.json");
        return res.json();
      })
      .then(function (data) {
        var repo = null;
        for (var i = 0; i < data.length; i++) {
          if (data[i].repo === repoName) { repo = data[i]; break; }
        }
        if (!repo) {
          document.getElementById("repo-title").textContent = "Not found";
          document.getElementById("detail-root").innerHTML =
            '<div class="detail-error">Repo "' + repoName + '" not found in dataset. <a href="/repo-health-pulse/monitor/" style="color:var(--accent)">Go back.</a></div>';
          return;
        }
        renderDetail(repo, data);
      })
      .catch(function (err) {
        document.getElementById("detail-root").innerHTML =
          '<div class="detail-error">Error: ' + err.message + '</div>';
        console.error(err);
      });
  })();
  </script>
</body>
</html>
