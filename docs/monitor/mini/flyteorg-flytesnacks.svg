<svg xmlns="http://www.w3.org/2000/svg" width="480" height="80" viewBox="0 0 480 80">
  <defs>
    <style>
      @keyframes flat-sweep {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      @keyframes fade {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.7; }
      }
      .bg { fill: #1a1c20; }
      .ecg {
        fill: none;
        stroke: #6b7280;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        /* no filter - avoids render glitch */
        stroke-dasharray: 1000;
        animation: flat-sweep 6s linear infinite;
      }
      .repo { fill: #6b7280; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 12px; }
      .repo-dim { fill: #4b5563; }
      .score { fill: #6b7280; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 20px; font-weight: bold; }
      .score-unit { fill: #4b5563; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 11px; }
      .status { fill: #6b7280; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; animation: fade 3s ease-in-out infinite; }
      .dot { fill: #6b7280; animation: fade 3s ease-in-out infinite; }
      .border { fill: none; stroke: #2e3238; stroke-width: 1; rx: 6; }

        .repo { fill: #6b7280; }
        .repo-dim { fill: #94a3b8; }
        .score-unit { fill: #64748b; }
        .border { stroke: #e2e8f0; }
      }
    </style>
  </defs>

