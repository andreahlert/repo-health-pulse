  <defs>
    <style>
      @keyframes trace-fast {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      @keyframes fade {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.7; }
      }
      .bg { fill: #1a1c20; }
      .ecg {
        fill: none;
        stroke: #eab308;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        /* no filter - avoids render glitch */
        stroke-dasharray: 1000;
        animation: trace-fast 2.5s linear infinite;
