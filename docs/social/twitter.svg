<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <clipPath id="monitorClip">
      <rect x="480" y="80" width="680" height="420" rx="16"/>
    </clipPath>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2127"/>
      <stop offset="100%" stop-color="#15171a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="#ffffff"/>

  <!-- Subtle grid pattern on white bg -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f0f0f0" stroke-width="0.5"/>
  </pattern>
  <rect width="460" height="675" fill="url(#grid)"/>

  <!-- Left side: Branding -->
  <!-- Heart rate icon -->
  <g transform="translate(50, 160)">
    <circle cx="24" cy="24" r="24" fill="#dcfce7"/>
    <path d="M12,24 L18,24 L20,18 L24,30 L28,14 L30,24 L36,24" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Repovital brand -->
  <text x="50" y="256" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#16a34a" letter-spacing="-1.5">Repovital</text>

  <!-- Subtitle -->
  <text x="50" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="19" fill="#6b7280" font-weight="400">Your repo's vital signs</text>
  <text x="50" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="19" fill="#6b7280" font-weight="400">as a living ECG</text>

  <!-- Stats -->
  <g transform="translate(50, 370)">
    <rect width="170" height="52" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="85" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#16a34a" font-weight="700" text-anchor="middle">1,069</text>
    <text x="85" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">repos analyzed</text>
  </g>
  <g transform="translate(230, 370)">
    <rect width="190" height="52" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="95" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#16a34a" font-weight="700" text-anchor="middle">Population-based</text>
    <text x="95" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">scoring system</text>
  </g>
  <g transform="translate(50, 432)">
    <rect width="170" height="52" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="85" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#16a34a" font-weight="700" text-anchor="middle">4 Cohorts</text>
    <text x="85" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">size-based grouping</text>
  </g>

  <!-- Right side: ECG Monitor -->
  <!-- Monitor outer frame -->
  <rect x="476" y="76" width="688" height="428" rx="18" fill="#2a2d33" stroke="#3a3d44" stroke-width="1"/>
  <!-- Monitor screen -->
  <rect x="488" y="88" width="664" height="404" rx="12" fill="url(#screenGlow)"/>

  <!-- Monitor header bar -->
  <rect x="488" y="88" width="664" height="40" rx="12" fill="#22252a"/>
  <rect x="488" y="116" width="664" height="12" fill="#22252a"/>
  <!-- Fake window dots -->
  <circle cx="510" cy="108" r="5" fill="#ef4444" opacity="0.7"/>
  <circle cx="528" cy="108" r="5" fill="#f59e0b" opacity="0.7"/>
  <circle cx="546" cy="108" r="5" fill="#22c55e" opacity="0.7"/>
  <text x="820" y="113" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="500">repovital.dev/repo/prefecthq/prefect</text>

  <!-- Grid lines on monitor -->
  <g opacity="0.08" stroke="#16a34a">
    <line x1="488" y1="180" x2="1152" y2="180"/>
    <line x1="488" y1="230" x2="1152" y2="230"/>
    <line x1="488" y1="280" x2="1152" y2="280"/>
    <line x1="488" y1="330" x2="1152" y2="330"/>
    <line x1="488" y1="380" x2="1152" y2="380"/>
    <line x1="588" y1="138" x2="588" y2="430"/>
    <line x1="688" y1="138" x2="688" y2="430"/>
    <line x1="788" y1="138" x2="788" y2="430"/>
    <line x1="888" y1="138" x2="888" y2="430"/>
    <line x1="988" y1="138" x2="988" y2="430"/>
    <line x1="1088" y1="138" x2="1088" y2="430"/>
  </g>

  <!-- ECG Waveform - main trace -->
  <g filter="url(#softGlow)">
    <!-- First heartbeat cycle -->
    <polyline points="500,290 540,290 548,290 553,282 560,298 565,290 590,290 594,290 597,240 602,340 605,278 609,290 640,290 645,284 652,280 662,280 668,284 673,290 710,290"
      fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
    <!-- Second heartbeat cycle -->
    <polyline points="710,290 750,290 758,290 763,282 770,298 775,290 800,290 804,290 807,240 812,340 815,278 819,290 850,290 855,284 862,280 872,280 878,284 883,290 920,290"
      fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
    <!-- Third heartbeat cycle (partial) -->
    <polyline points="920,290 960,290 968,290 973,282 980,298 985,290 1010,290 1014,290 1017,240 1022,340 1025,278 1029,290 1060,290 1065,284 1072,280 1082,280 1088,284 1093,290 1140,290"
      fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  </g>

  <!-- Scanning line effect -->
  <line x1="1140" y1="138" x2="1140" y2="430" stroke="#22c55e" stroke-width="1" opacity="0.3"/>

  <!-- Vital signs panel - right overlay on monitor -->
  <rect x="1020" y="140" width="128" height="210" rx="8" fill="#1a1c20" opacity="0.85"/>
  <line x1="1020" y1="140" x2="1020" y2="350" stroke="#2a2d33" stroke-width="1"/>

  <!-- Heart rate -->
  <text x="1035" y="163" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280" font-weight="500">HEART RATE</text>
  <text x="1035" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#22c55e" font-weight="700">72</text>
  <text x="1100" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">bpm</text>

  <!-- CI Status -->
  <text x="1035" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280" font-weight="500">CI PASS</text>
  <text x="1035" y="243" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#22c55e" font-weight="700">100%</text>

  <!-- PR Merge Time -->
  <text x="1035" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280" font-weight="500">PR MERGE</text>
  <text x="1035" y="293" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#22c55e" font-weight="700">3.4h</text>

  <!-- Release Freq -->
  <text x="1035" y="318" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280" font-weight="500">RELEASES</text>
  <text x="1035" y="343" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#22c55e" font-weight="700">1.56/wk</text>

  <!-- Score badge on monitor -->
  <rect x="500" y="440" width="80" height="36" rx="8" fill="#16a34a"/>
  <text x="540" y="464" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">Score 92</text>

  <!-- Repo name under monitor -->
  <text x="600" y="466" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6b7280">prefecthq/prefect</text>

  <!-- Status text -->
  <text x="770" y="466" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#22c55e" font-weight="600">Healthy</text>

  <!-- Bottom bar -->
  <rect x="0" y="625" width="1200" height="50" fill="#fafafa"/>
  <line x1="0" y1="625" x2="1200" y2="625" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Bottom left: URL -->
  <g transform="translate(50, 645)">
    <circle cx="8" cy="8" r="8" fill="#16a34a"/>
    <path d="M4,8 L7,8 L8,4 L9,12 L10,6 L11,8 L12,8" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="24" y="13" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#374151" font-weight="600">repovital.dev</text>
  </g>

  <!-- Bottom right: Open Source badge -->
  <g transform="translate(1040, 639)">
    <rect width="120" height="28" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="60" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#16a34a" font-weight="600" text-anchor="middle">Open Source</text>
  </g>

  <!-- Bottom center: GitHub -->
  <text x="600" y="656" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">github.com/ahlertdev/repovital</text>
</svg>