<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
  <defs>
    <linearGradient id="screenBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2127"/>
      <stop offset="100%" stop-color="#15171a"/>
    </linearGradient>
    <filter id="glowGreen">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowAmber">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowRed">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="627" fill="#ffffff"/>

  <!-- Top section: Brand header -->
  <rect x="0" y="0" width="1200" height="120" fill="#fafafa"/>
  <line x1="0" y1="120" x2="1200" y2="120" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Brand icon -->
  <g transform="translate(60, 35)">
    <rect width="50" height="50" rx="12" fill="#16a34a"/>
    <path d="M12,25 L18,25 L20,18 L25,32 L30,12 L33,25 L38,25" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Brand text -->
  <text x="125" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#16a34a" letter-spacing="-1">Repovital</text>
  <text x="125" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#6b7280" font-weight="400">Vital signs for every repository</text>

  <!-- Right side tagline -->
  <text x="1140" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#9ca3af" text-anchor="end" font-weight="400">Population-based health scoring</text>
  <text x="1140" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#9ca3af" text-anchor="end" font-weight="400">for open source projects</text>

  <!-- ============================================ -->
  <!-- MONITOR 1: Healthy (Green) - prefecthq/prefect -->
  <!-- ============================================ -->
  <g transform="translate(60, 145)">
    <!-- Monitor frame -->
    <rect width="340" height="300" rx="14" fill="#2a2d33" stroke="#3a3d44" stroke-width="1"/>
    <!-- Screen -->
    <rect x="8" y="8" width="324" height="284" rx="10" fill="url(#screenBg)"/>

    <!-- Header -->
    <rect x="8" y="8" width="324" height="32" rx="10" fill="#22252a"/>
    <rect x="8" y="30" width="324" height="10" fill="#22252a"/>
    <circle cx="24" cy="24" r="4" fill="#22c55e" opacity="0.8"/>
    <text x="38" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" font-weight="500">prefecthq/prefect</text>

    <!-- Status badge -->
    <rect x="248" y="14" width="70" height="20" rx="10" fill="#16a34a" opacity="0.2"/>
    <text x="283" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#22c55e" font-weight="600" text-anchor="middle">Healthy</text>

    <!-- Grid -->
    <g opacity="0.06" stroke="#22c55e">
      <line x1="8" y1="100" x2="332" y2="100"/>
      <line x1="8" y1="150" x2="332" y2="150"/>
      <line x1="8" y1="200" x2="332" y2="200"/>
      <line x1="80" y1="45" x2="80" y2="240"/>
      <line x1="160" y1="45" x2="160" y2="240"/>
      <line x1="240" y1="45" x2="240" y2="240"/>
    </g>

    <!-- ECG Waveform - Healthy: regular, clean -->
    <g filter="url(#glowGreen)">
      <polyline points="15,155 45,155 52,155 56,148 62,162 66,155 85,155 88,155 91,118 95,192 98,145 101,155 125,155 129,150 135,147 143,147 148,150 152,155 180,155
        207,155 215,155 219,148 225,162 229,155 248,155 251,155 254,118 258,192 261,145 264,155 288,155 292,150 298,147 306,147 311,150 315,155 325,155"
        fill="none" stroke="#22c55e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Score display -->
    <text x="28" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="40" fill="#22c55e" font-weight="700">92</text>
    <text x="82" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6b7280">/100</text>

    <!-- Vitals row -->
    <g transform="translate(0, 240)">
      <rect x="16" y="0" width="96" height="40" rx="6" fill="#1a1c20"/>
      <text x="64" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">CI PASS</text>
      <text x="64" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#22c55e" font-weight="700" text-anchor="middle">100%</text>

      <rect x="122" y="0" width="96" height="40" rx="6" fill="#1a1c20"/>
      <text x="170" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">PR MERGE</text>
      <text x="170" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#22c55e" font-weight="700" text-anchor="middle">3.4h</text>

      <rect x="228" y="0" width="96" height="40" rx="6" fill="#1a1c20"/>
      <text x="276" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">RELEASES</text>
      <text x="276" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#22c55e" font-weight="700" text-anchor="middle">1.56/wk</text>
    </g>
  </g>

  <!-- ============================================ -->
  <!-- MONITOR 2: Stressed (Amber) - facebook/react -->
  <!-- ============================================ -->
  <g transform="translate(430, 145)">
    <!-- Monitor frame -->
    <rect width="340" height="300" rx="14" fill="#2a2d33" stroke="#3a3d44" stroke-width="1"/>
    <!-- Screen -->
    <rect x="8" y="8" width="324" height="284" rx="10" fill="url(#screenBg)"/>

    <!-- Header -->
    <rect x="8" y="8" width="324" height="32" rx="10" fill="#22252a"/>
    <rect x="8" y="30" width="324" height="10" fill="#22252a"/>
    <circle cx="24" cy="24" r="4" fill="#f59e0b" opacity="0.8"/>
    <text x="38" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" font-weight="500">facebook/react</text>

    <!-- Status badge -->
    <rect x="248" y="14" width="70" height="20" rx="10" fill="#f59e0b" opacity="0.15"/>
    <text x="283" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#f59e0b" font-weight="600" text-anchor="middle">Stressed</text>

    <!-- Grid -->
    <g opacity="0.06" stroke="#f59e0b">
      <line x1="8" y1="100" x2="332" y2="100"/>
      <line x1="8" y1="150" x2="332" y2="150"/>
      <line x1="8" y1="200" x2="332" y2="200"/>
      <line x1="80" y1="45" x2="80" y2="240"/>
      <line x1="160" y1="45" x2="160" y2="240"/>
      <line x1="240" y1="45" x2="240" y2="240"/>
    </g>

    <!-- ECG Waveform - Stressed: faster rhythm, taller peaks -->
    <g filter="url(#glowAmber)">
      <polyline points="15,155 35,155 40,155 43,145 48,165 52,155 65,155 67,155 70,105 74,200 77,138 80,155 95,155 98,150 103,146 108,146 112,150 115,155
        135,155 142,155 145,145 150,165 154,155 167,155 169,155 172,105 176,200 179,138 182,155 197,155 200,150 205,146 210,146 214,150 217,155
        237,155 244,155 247,145 252,165 256,155 269,155 271,155 274,105 278,200 281,138 284,155 299,155 302,150 307,146 312,146 316,150 319,155 325,155"
        fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Score display -->
    <text x="28" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="40" fill="#f59e0b" font-weight="700">58</text>
    <text x="82" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6b7280">/100</text>

    <!-- Vitals row -->
    <g transform="translate(0, 240)">
      <rect x="16" y="0" width="96" height="40" rx="6" fill="#1a1c20"/>
      <text x="64" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">CI PASS</text>
      <text x="64" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#f59e0b" font-weight="700" text-anchor="middle">78%</text>

      <rect x="122" y="0" width="96" height="40" rx="6" fill="#1a1c20"/>
      <text x="170" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">PR MERGE</text>
      <text x="170" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#f59e0b" font-weight="700" text-anchor="middle">48h</text>

      <rect x="228" y="0" width="96" height="40" rx="6" fill="#1a1c20"/>
      <text x="276" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">RELEASES</text>
      <text x="276" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#f59e0b" font-weight="700" text-anchor="middle">0.3/wk</text>
    </g>
  </g>

  <!-- ============================================ -->
  <!-- MONITOR 3: Critical (Red) - kubernetes/kubernetes -->
  <!-- ============================================ -->
  <g transform="translate(800, 145)">
    <!-- Monitor frame -->
    <rect width="340" height="300" rx="14" fill="#2a2d33" stroke="#3a3d44" stroke-width="1"/>
    <!-- Screen -->
    <rect x="8" y="8" width="324" height="284" rx="10" fill="url(#screenBg)"/>

    <!-- Header -->
    <rect x="8" y="8" width="324" height="32" rx="10" fill="#22252a"/>
    <rect x="8" y="30" width="324" height="10" fill="#22252a"/>
    <circle cx="24" cy="24" r="4" fill="#ef4444" opacity="0.8"/>
    <text x="38" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" font-weight="500">kubernetes/kubernetes</text>

    <!-- Status badge -->
    <rect x="248" y="14" width="70" height="20" rx="10" fill="#ef4444" opacity="0.15"/>
    <text x="283" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#ef4444" font-weight="600" text-anchor="middle">Critical</text>

    <!-- Grid -->
    <g opacity="0.06" stroke="#ef4444">
      <line x1="8" y1="100" x2="332" y2="100"/>
      <line x1="8" y1="150" x2="332" y2="150"/>
      <line x1="8" y1="200" x2="332" y2="200"/>
      <line x1="80" y1="45" x2="80" y2="240"/>
      <line x1="160" y1="45" x2="160" y2="240"/>
      <line x1="240" y1="45" x2="240" y2="240"/>
    </g>

    <!-- ECG Waveform - Critical: irregular, distorted -->
    <g filter="url(#glowRed)">
      <polyline points="15,155 30,155 38,155 42,142 46,170 50,148 55,162 58,155 75,155 78,100 82,195 86,120 90,175 93,155 115,158
        140,152 148,155 155,140 160,175 162,130 168,180 172,155 195,155 210,158 218,150 222,162
        235,148 240,155 255,155 260,158 270,150 274,168 278,140 285,170 290,155 310,152 320,155 325,155"
        fill="none" stroke="#ef4444" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Score display -->
    <text x="28" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="40" fill="#ef4444" font-weight="700">35</text>
    <text x="82" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6b7280">/100</text>

    <!-- Vitals row -->
    <g transform="translate(0, 240)">
      <rect x="16" y="0" width="96" height="40" rx="6" fill="#1a1c20"/>
      <text x="64" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">CI PASS</text>
      <text x="64" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#ef4444" font-weight="700" text-anchor="middle">42%</text>

      <rect x="122" y="0" width="96" height="40" rx="6" fill="#1a1c20"/>
      <text x="170" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">PR MERGE</text>
      <text x="170" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#ef4444" font-weight="700" text-anchor="middle">14d</text>

      <rect x="228" y="0" width="96" height="40" rx="6" fill="#1a1c20"/>
      <text x="276" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">RELEASES</text>
      <text x="276" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#ef4444" font-weight="700" text-anchor="middle">0.02/wk</text>
    </g>
  </g>

  <!-- Bottom stats bar -->
  <rect x="0" y="475" width="1200" height="80" fill="#fafafa"/>
  <line x1="0" y1="475" x2="1200" y2="475" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Stats row -->
  <g transform="translate(120, 498)">
    <rect width="180" height="42" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="90" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#16a34a" font-weight="700" text-anchor="middle">1,069</text>
    <text x="90" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">code repos analyzed</text>
  </g>
  <g transform="translate(330, 498)">
    <rect width="180" height="42" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="90" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#16a34a" font-weight="700" text-anchor="middle">4 Cohorts</text>
    <text x="90" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">size-based grouping</text>
  </g>
  <g transform="translate(540, 498)">
    <rect width="200" height="42" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="100" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#16a34a" font-weight="700" text-anchor="middle">Population-based</text>
    <text x="100" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">scoring system</text>
  </g>
  <g transform="translate(770, 498)">
    <rect width="180" height="42" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="90" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#16a34a" font-weight="700" text-anchor="middle">Real-time</text>
    <text x="90" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">ECG visualization</text>
  </g>

  <!-- Footer -->
  <rect x="0" y="577" width="1200" height="50" fill="#ffffff"/>
  <line x1="0" y1="577" x2="1200" y2="577" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Footer left: URL -->
  <g transform="translate(60, 593)">
    <rect width="36" height="24" rx="6" fill="#16a34a"/>
    <path d="M10,12 L14,12 L15,7 L18,17 L21,5 L23,12 L26,12" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="46" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#374151" font-weight="600">repovital.dev</text>
  </g>

  <!-- Footer right: Open Source badge -->
  <g transform="translate(1010, 591)">
    <rect width="130" height="28" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="65" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#16a34a" font-weight="600" text-anchor="middle">Open Source</text>
  </g>

  <!-- Footer center -->
  <text x="600" y="608" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">github.com/ahlertdev/repovital</text>
</svg>