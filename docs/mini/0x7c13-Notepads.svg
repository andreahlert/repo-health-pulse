<svg xmlns="http://www.w3.org/2000/svg" width="480" height="80" viewBox="0 0 480 80">
  <defs>
    <style>
      @keyframes trace-erratic {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      @keyframes fade {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.7; }
      }
      @keyframes blink-crit {
        0%, 100% { opacity: 1; }
        30% { opacity: 0; }
        60% { opacity: 1; }
        80% { opacity: 0; }
      }
      .bg { fill: #1a1c20; }
      .ecg {
        fill: none;
        stroke: #ef4444;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        /* no filter - avoids render glitch */
        stroke-dasharray: 1000;
        animation: trace-erratic 3.5s linear infinite;
      }
      .repo { fill: #e2e8f0; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 12px; }
      .repo-dim { fill: #64748b; }
      .score { fill: #ef4444; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 20px; font-weight: bold; }
      .score-unit { fill: #94a3b8; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 11px; }
      .status { fill: #ef4444; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; animation: blink-crit 0.8s ease-in-out infinite; }
      .dot { fill: #ef4444; animation: blink-crit 0.5s ease-in-out infinite; }
      .border { fill: none; stroke: #ef444425; stroke-width: 1; rx: 6; }

      @media (prefers-color-scheme: light) {
        .bg { fill: #ffffff; }
        .repo { fill: #1e293b; }
        .repo-dim { fill: #94a3b8; }
        .score-unit { fill: #64748b; }
        .border { stroke: #e2e8f0; }
      }
    </style>
  </defs>

  <rect class="bg" width="480" height="80" rx="6"/>
  <rect width="480" height="80" rx="6" fill="#ef4444" opacity="0.02"/>
  <rect class="border" x="0.5" y="0.5" width="479" height="79"/>

