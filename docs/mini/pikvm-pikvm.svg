  <defs>
    <style>
      @keyframes trace {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      @keyframes fade {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.7; }
      }
      .bg { fill: #1a1c20; }
      .ecg {
        fill: none;
        stroke: #4ade80;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        /* no filter - avoids render glitch */
        stroke-dasharray: 1000;
        animation: trace 4s linear infinite;
      }
      .repo { fill: #e2e8f0; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 12px; }
      .repo-dim { fill: #64748b; }
      .score { fill: #4ade80; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 20px; font-weight: bold; }
      .score-unit { fill: #94a3b8; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 11px; }
      .status { fill: #4ade80; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 10px; text-transform: uppercase; letter-spacing: 1px;  }
      .dot { fill: #4ade80; animation: pulse 1.5s ease-in-out infinite; }
      .border { fill: none; stroke: #2e3238; stroke-width: 1; rx: 6; }
    </style>
  </defs>

