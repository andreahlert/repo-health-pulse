<svg xmlns="http://www.w3.org/2000/svg" width="280" height="32" viewBox="0 0 280 32">
  <defs>
    <style>
      @keyframes badge-trace {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes badge-pulse {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
      .badge-bg-left { fill: #1a1c20; }
      .badge-bg-right { fill: #1e1e20; }
      .badge-text { fill: #e2e8f0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 11px; }
      .badge-value { fill: #6b7280; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 11px; font-weight: bold;  }
      .badge-ecg {
        fill: none;
        stroke: #6b7280;
        stroke-width: 1.8;
        stroke-linecap: round;
        /* no filter - avoids render glitch */
        stroke-dasharray: 200;
        animation: badge-trace 6s linear infinite;
      }
      .badge-heart { fill: #4b5563; font-size: 10px;  }

      @media (prefers-color-scheme: light) {
        .badge-bg-left { fill: #f1f5f9; }
        .badge-bg-right { fill: #f8fafc; }
        .badge-text { fill: #1e293b; }
      }
    </style>
  </defs>

  <rect class="badge-bg-left" width="90" height="32" rx="4"/>
  <rect class="badge-bg-right" x="90" width="190" height="32" rx="0"/>
  <rect class="badge-bg-right" x="276" width="4" height="32" rx="4"/>
  <rect fill="none" stroke="#2e3238" stroke-width="1" x="0.5" y="0.5" width="279" height="31" rx="4"/>

  <text class="badge-text" x="10" y="20">health</text>

  <path class="badge-ecg" d="M 95,16 L 103,16.25 L 111,16.38 L 119,16.35 L 127,16.32 L 135,16.24 L 143,16.19 L 151,16.22 L 159,16.21 L 167,16.1 L 175,16.08 L 183,16.07 L 191,16.15 L 199,16.02 L 207,16.07 L 215,16.04 L 223,15.93 L 226,16"/>

  <text class="badge-value" x="232" y="20">10/100</text>
  <text class="badge-heart" x="268" y="20">&#x2665;</text>
</svg>