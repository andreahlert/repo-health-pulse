<svg xmlns="http://www.w3.org/2000/svg" width="280" height="32" viewBox="0 0 280 32">
  <defs>
    <style>
      @keyframes badge-trace {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes badge-pulse {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
      .badge-bg-left { fill: #1a1c20; }
      .badge-bg-right { fill: #24221a; }
      .badge-text { fill: #e2e8f0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 11px; }
      .badge-value { fill: #eab308; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 11px; font-weight: bold;  }
      .badge-ecg {
        fill: none;
        stroke: #eab308;
        stroke-width: 1.8;
        stroke-linecap: round;
        /* no filter - avoids render glitch */
        stroke-dasharray: 200;
        animation: badge-trace 2.5s linear infinite;
      }
      .badge-heart { fill: #eab308; font-size: 10px; animation: badge-pulse 0.6s ease-in-out infinite; }
    </style>
  </defs>

  <rect class="badge-bg-left" width="90" height="32" rx="4"/>
