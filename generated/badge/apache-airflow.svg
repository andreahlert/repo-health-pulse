<svg xmlns="http://www.w3.org/2000/svg" width="280" height="32" viewBox="0 0 280 32">
  <defs>
    <style>
      @keyframes badge-trace {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes badge-pulse {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
      .badge-bg-left { fill: #1a1c20; }
      .badge-bg-right { fill: #24221a; }
      .badge-text { fill: #e2e8f0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 11px; }
      .badge-value { fill: #eab308; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 11px; font-weight: bold;  }
      .badge-ecg {
        fill: none;
        stroke: #eab308;
        stroke-width: 1.8;
        stroke-linecap: round;
        filter: drop-shadow(0 0 2px #eab30850);
        stroke-dasharray: 200;
        animation: badge-trace 2.5s linear infinite;
      }
      .badge-heart { fill: #eab308; font-size: 10px; animation: badge-pulse 0.6s ease-in-out infinite; }
    </style>
  </defs>

  <rect class="badge-bg-left" width="90" height="32" rx="4"/>
  <rect class="badge-bg-right" x="90" width="190" height="32" rx="0"/>
  <rect class="badge-bg-right" x="276" width="4" height="32" rx="4"/>
  <rect fill="none" stroke="#2e3238" stroke-width="1" x="0.5" y="0.5" width="279" height="31" rx="4"/>

  <text class="badge-text" x="10" y="20">health</text>

  <path class="badge-ecg" d="M 95,16 L 104,16
    L 106,16 L 107,13 L 109,19 L 110,16
    L 115,16 L 117,16 L 118,6 L 120,26 L 122,13 L 123,16
    L 130,16 L 132,14 L 134,13 L 137,14 L 138,16 L 145,16
    L 154,16 L 156,16 L 157,13 L 159,19 L 160,16
    L 165,16 L 167,16 L 168,6 L 170,26 L 172,13 L 173,16
    L 180,16 L 182,14 L 184,13 L 187,14 L 188,16 L 195,16
    L 204,16 L 206,16 L 207,13 L 209,19 L 210,16
    L 215,16 L 217,16 L 218,6 L 220,26 L 222,13 L 223,16 L 226,16"/>

  <text class="badge-value" x="232" y="20">61/100</text>
  <text class="badge-heart" x="268" y="20">&#x2665;</text>
</svg>