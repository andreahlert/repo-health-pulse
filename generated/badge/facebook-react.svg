<svg xmlns="http://www.w3.org/2000/svg" width="280" height="32" viewBox="0 0 280 32">
  <defs>
    <style>
      @keyframes badge-trace {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes badge-pulse {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
      @keyframes badge-blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      .badge-bg-left { fill: #1a1c20; }
      .badge-bg-right { fill: #241a1a; }
      .badge-text { fill: #e2e8f0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 11px; }
      .badge-value { fill: #ef4444; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 11px; font-weight: bold; animation: badge-blink 1s ease-in-out infinite; }
      .badge-ecg {
        fill: none;
        stroke: #ef4444;
        stroke-width: 1.8;
        stroke-linecap: round;
        /* no filter - avoids render glitch */
        stroke-dasharray: 200;
        animation: badge-trace 3.5s linear infinite;
      }
      .badge-heart { fill: #ef4444; font-size: 10px; animation: badge-blink 0.4s ease-in-out infinite; }
    </style>
  </defs>

  <rect class="badge-bg-left" width="90" height="32" rx="4"/>
  <rect class="badge-bg-right" x="90" width="190" height="32" rx="0"/>
  <rect class="badge-bg-right" x="276" width="4" height="32" rx="4"/>
  <rect fill="none" stroke="#ef444425" stroke-width="1" x="0.5" y="0.5" width="279" height="31" rx="4"/>

  <text class="badge-text" x="10" y="20">health</text>

