<svg xmlns="http://www.w3.org/2000/svg" width="480" height="80" viewBox="0 0 480 80">
  <defs>
    <style>
      @keyframes flat-sweep {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      @keyframes fade {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.7; }
      }
      .bg { fill: #1a1c20; }
      .ecg {
        fill: none;
        stroke: #6b7280;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        /* no filter - avoids render glitch */
        stroke-dasharray: 1000;
        animation: flat-sweep 6s linear infinite;
      }
      .repo { fill: #6b7280; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 12px; }
      .repo-dim { fill: #4b5563; }
      .score { fill: #6b7280; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 20px; font-weight: bold; }
      .score-unit { fill: #4b5563; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 11px; }
      .status { fill: #6b7280; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; animation: fade 3s ease-in-out infinite; }
      .dot { fill: #6b7280; animation: fade 3s ease-in-out infinite; }
      .border { fill: none; stroke: #2e3238; stroke-width: 1; rx: 6; }

      @media (prefers-color-scheme: light) {
        .bg { fill: #ffffff; }
        .repo { fill: #6b7280; }
        .repo-dim { fill: #94a3b8; }
        .score-unit { fill: #64748b; }
        .border { stroke: #e2e8f0; }
      }
    </style>
  </defs>

  <rect class="bg" width="480" height="80" rx="6"/>
  
  <rect class="border" x="0.5" y="0.5" width="479" height="79"/>

  <path class="ecg" d="M 15,40 L 23,40.18 L 31,40.19 L 39,40.41 L 47,40.45 L 55,40.65 L 63,40.5 L 71,40.45 L 79,40.69 L 87,40.6 L 95,40.75 L 103,40.66 L 111,40.62 L 119,40.75 L 127,40.69 L 135,40.76 L 143,40.47 L 151,40.41 L 159,40.45 L 167,40.52 L 175,40.42 L 183,40.27 L 191,40.17 L 199,40.13 L 207,40.03 L 215,39.81 L 223,39.97 L 231,39.69 L 239,39.57 L 247,39.47 L 255,39.44 L 263,39.36 L 271,39.54 L 279,39.61 L 287,39.5 L 295,39.51 L 303,39.29 L 311,39.2 L 319,39.38 L 327,39.24 L 335,39.49 L 343,39.5 L 351,39.31 L 359,39.55 L 367,39.55 L 375,39.46 L 383,39.69 L 385,40"/>

  <text class="repo" x="15" y="68">
    <tspan class="repo-dim">expressjs/</tspan>express
  </text>

  <circle class="dot" cx="410" cy="28" r="3"/>
  <text class="status" x="418" y="32">flatline</text>

  <text class="score" x="410" y="58">10</text>
  <text class="score-unit" x="438" y="58">/100</text>
</svg>