    L 180,40 L 182,37 L 186,34 L 191,34 L 195,37 L 197,40
    L 207,40
    L 216,41 L 219,39 L 222,43 L 225,37 L 228,44 L 231,38 L 234,41
    L 242,40 L 244,40 L 246,16 L 249,60 L 251,32 L 254,40
    L 268,40 L 270,37 L 274,34 L 280,34 L 284,37 L 286,40
    L 300,40
    L 335,40 L 337,38 L 340,42 L 342,40
    L 349,40 L 351,40 L 353,13 L 356,63 L 358,29 L 361,42 L 363,37 L 365,40
    L 378,40 L 385,40"/>

  <text class="repo" x="15" y="68">
    <tspan class="repo-dim">expressjs/</tspan>express
