<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220">
  <defs>
    <style>
      @keyframes trace-fast {
        0% { stroke-dashoffset: 2400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
      @keyframes fade-slow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.7; }
      }
      .bg { fill: #1a1c20; }
      .ecg-line {
        fill: none;
        stroke: #eab308;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(0 0 4px #eab30850);
        stroke-dasharray: 2400;
        animation: trace-fast 2.5s linear infinite;
      }
      .grid-line { stroke: #262a30; stroke-width: 0.5; }
      .label { fill: #94a3b8; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
      .val { fill: #e2e8f0; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 15px; font-weight: bold; }
      .val-unit { fill: #64748b; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 10px; }
      .val-ci { fill: #ef4444; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 15px; font-weight: bold;  }
      .val-pr { fill: #4ade80; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 15px; font-weight: bold; }
      .val-rel { fill: #f59e0b; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 15px; font-weight: bold; }
      .val-resp { fill: #4ade80; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 15px; font-weight: bold; }
      .repo-name { fill: #e2e8f0; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 14px; font-weight: bold; }
      .status-text { fill: #eab308; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 12px; font-weight: bold;  }
      .status-dot { fill: #eab308; animation: blink 0.8s ease-in-out infinite; }
      .divider { stroke: #2e3238; stroke-width: 1; }
      .bar-bg { fill: #262a30; rx: 3; }
      .bar-fill { fill: #eab308; rx: 3; opacity: 0.85; }
      .border { fill: none; stroke: #2e3238; stroke-width: 1; rx: 8; }
      .heart { fill: #eab308; animation: pulse-glow 0.6s ease-in-out infinite; font-size: 18px; }
      .bpm { fill: #eab308; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 22px; font-weight: bold; }
      .bpm-unit { fill: #eab30899; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 10px; }
    </style>
  </defs>

  <rect class="bg" width="800" height="220" rx="8"/>
  
  <rect class="border" x="0.5" y="0.5" width="799" height="219"/>

  <g opacity="0.3">
    <line class="grid-line" x1="0" y1="44" x2="555" y2="44"/>
    <line class="grid-line" x1="0" y1="88" x2="555" y2="88"/>
    <line class="grid-line" x1="0" y1="132" x2="555" y2="132"/>
    <line class="grid-line" x1="0" y1="176" x2="555" y2="176"/>
  </g>

  <path class="ecg-line" d="M 0,110
    L 15,110 L 18,110 L 20,103 L 24,117 L 26,110
    L 36,110 L 38,108 L 41,106 L 44,110
    L 50,110 L 52,110 L 54,50 L 58,150 L 60,88 L 63,110
    L 73,110 L 75,100 L 80,92 L 86,92 L 91,100 L 93,110
    L 110,110
    L 125,110 L 128,110 L 130,103 L 134,117 L 136,110
    L 146,110 L 148,108 L 151,106 L 154,110
    L 160,110 L 162,110 L 164,50 L 168,150 L 170,88 L 173,110
    L 183,110 L 185,100 L 190,92 L 196,92 L 201,100 L 203,110
    L 220,110
    L 235,110 L 238,110 L 240,103 L 244,117 L 246,110
    L 256,110 L 258,108 L 261,106 L 264,110
    L 270,110 L 272,110 L 274,50 L 278,150 L 280,88 L 283,110
    L 293,110 L 295,100 L 300,92 L 306,92 L 311,100 L 313,110
    L 330,110
    L 345,110 L 348,110 L 350,103 L 354,117 L 356,110
    L 366,110 L 368,108 L 371,106 L 374,110
    L 380,110 L 382,110 L 384,50 L 388,150 L 390,88 L 393,110
    L 403,110 L 405,100 L 410,92 L 416,92 L 421,100 L 423,110
    L 440,110
    L 455,110 L 458,110 L 460,103 L 464,117 L 466,110
    L 476,110 L 478,108 L 481,106 L 484,110
    L 490,110 L 492,110 L 494,50 L 498,150 L 500,88 L 503,110
    L 513,110 L 515,100 L 520,92 L 526,92 L 531,100 L 533,110
    L 555,110"/>
  

  <line class="divider" x1="570" y1="10" x2="570" y2="210"/>

  <text class="heart" x="585" y="33">&#x2665;</text>
  <text class="bpm" x="605" y="33">95</text>
  <text class="bpm-unit" x="638" y="33">bpm</text>

  <text class="label" x="585" y="62">ci pass rate</text>
  <text class="val-ci" x="780" y="62" text-anchor="end">53%</text>

  <text class="label" x="585" y="88">pr merge time</text>
  <text class="val-pr" x="757" y="88" text-anchor="end">13.8</text>
  <text class="val-unit" x="762" y="88">hrs</text>

  <text class="label" x="585" y="114">releases</text>
  <text class="val-rel" x="757" y="114" text-anchor="end">0.47</text>
  <text class="val-unit" x="762" y="114">/wk</text>

  <text class="label" x="585" y="140">response time</text>
  <text class="val-resp" x="757" y="140" text-anchor="end">1.4</text>
  <text class="val-unit" x="762" y="140">hrs</text>

  <rect class="bar-bg" x="585" y="158" width="195" height="8"/>
  <rect class="bar-fill" x="585" y="158" width="119" height="8"/>

  <circle class="status-dot" cx="593" cy="183" r="3.5"/>
  <text class="status-text" x="603" y="187">STRESSED</text>
  <text class="val" x="757" y="187" text-anchor="end">61</text>
  <text class="val-unit" x="762" y="187">/100</text>

  <text class="repo-name" x="20" y="205">
    <tspan fill="#64748b">apache/</tspan>airflow
  </text>
  
</svg>