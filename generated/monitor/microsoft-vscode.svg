  <text class="bpm" x="605" y="33">89</text>
  <text class="bpm-unit" x="638" y="33">bpm</text>

  <text class="label" x="585" y="62">ci pass rate</text>
  <text class="val-ci" x="780" y="62" text-anchor="end">60%</text>

  <text class="label" x="585" y="88">pr merge time</text>
  <text class="val-pr" x="757" y="88" text-anchor="end">1.8</text>
  <text class="val-unit" x="762" y="88">hrs</text>

  <text class="label" x="585" y="114">releases</text>
  <text class="val-rel" x="757" y="114" text-anchor="end">0.86</text>
  <text class="val-unit" x="762" y="114">/wk</text>

  <text class="label" x="585" y="140">response time</text>
  <text class="val-resp" x="757" y="140" text-anchor="end">1.6</text>
  <text class="val-unit" x="762" y="140">hrs</text>

  <rect class="bar-bg" x="585" y="158" width="195" height="8"/>
  <rect class="bar-fill" x="585" y="158" width="142" height="8"/>

  <circle class="status-dot" cx="593" cy="183" r="3.5"/>
  <text class="status-text" x="603" y="187">STRESSED</text>
  <text class="val" x="757" y="187" text-anchor="end">73</text>
  <text class="val-unit" x="762" y="187">/100</text>

  <text class="repo-name" x="20" y="205">
    <tspan fill="#64748b">microsoft/</tspan>vscode
  </text>
  
</svg>