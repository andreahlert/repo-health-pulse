<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220">
  <defs>
    <style>
      @keyframes trace-erratic {
        0% { stroke-dashoffset: 2400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
      @keyframes fade-slow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.7; }
      }
      @keyframes blink-crit {
        0%, 100% { opacity: 1; }
        30% { opacity: 0; }
        60% { opacity: 1; }
        80% { opacity: 0; }
      }
      @keyframes alert-flash {
        0%, 100% { fill: #ef4444; }
        50% { fill: #ef444440; }
      }
      .bg { fill: #1a1c20; }
      .ecg-line {
        fill: none;
        stroke: #ef4444;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(0 0 4px #ef444460);
        stroke-dasharray: 2400;
        animation: trace-erratic 3.5s linear infinite;
      }
      .grid-line { stroke: #262a30; stroke-width: 0.5; }
      .label { fill: #94a3b8; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
      .val { fill: #e2e8f0; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 15px; font-weight: bold; }
      .val-unit { fill: #64748b; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 10px; }
      .val-ci { fill: #ef4444; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 15px; font-weight: bold; animation: blink-crit 1.2s ease-in-out infinite; }
      .val-pr { fill: #f59e0b; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 15px; font-weight: bold; }
      .val-rel { fill: #6b7280; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 15px; font-weight: bold; }
      .val-resp { fill: #4ade80; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 15px; font-weight: bold; }
      .repo-name { fill: #e2e8f0; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 14px; font-weight: bold; }
      .status-text { fill: #ef4444; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 12px; font-weight: bold; animation: blink-crit 0.6s ease-in-out infinite; }
      .status-dot { fill: #ef4444; animation: alert-flash 0.4s ease-in-out infinite; }
      .divider { stroke: #2e3238; stroke-width: 1; }
      .bar-bg { fill: #262a30; rx: 3; }
      .bar-fill { fill: #ef4444; rx: 3; opacity: 0.85; }
      .border { fill: none; stroke: #ef444425; stroke-width: 1; rx: 8; }
      .heart { fill: #ef4444; animation: pulse-glow 0.4s ease-in-out infinite; font-size: 18px; }
      .bpm { fill: #ef4444; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 22px; font-weight: bold; }
      .bpm-unit { fill: #ef444499; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 10px; }
    </style>
  </defs>

  <rect class="bg" width="800" height="220" rx="8"/>
  <rect width="800" height="220" rx="8" fill="#ef4444" opacity="0.02"/>
  <rect class="border" x="0.5" y="0.5" width="799" height="219"/>

  <g opacity="0.3">
    <line class="grid-line" x1="0" y1="44" x2="555" y2="44"/>
    <line class="grid-line" x1="0" y1="88" x2="555" y2="88"/>
    <line class="grid-line" x1="0" y1="132" x2="555" y2="132"/>
    <line class="grid-line" x1="0" y1="176" x2="555" y2="176"/>
  </g>

  <path class="ecg-line" d="M 0,110 L 9.105140420706142,110 L 9.105140420706142,110 L 11.105140420706142,122.10305029285658 L 13.105140420706142,59.670455117868684 L 15.105140420706142,141.49568224697902 L 16.605140420706142,119.35420461171698 L 18.605140420706142,110 L 21.64853927693194,110 L 24.04853927693194,103 L 27.64853927693194,92.5 L 31.24853927693194,103 L 33.64853927693194,110 L 39.571962365947634,110 L 195.88768340264232,110 L 205.455573646776,110 L 205.455573646776,110 L 207.455573646776,120.79953356196594 L 209.455573646776,51.47432092481695 L 211.455573646776,135.81617110019192 L 212.955573646776,119.83435003304328 L 214.955573646776,110 L 219.01269641100683,110 L 221.41269641100683,103 L 225.01269641100683,92.5 L 228.61269641100682,103 L 231.01269641100683,110 L 234.94432856696133,110 L 353.93350698653,110 L 362.7366065021945,110 L 362.7366065021945,110 L 364.7366065021945,122.60902474790022 L 366.7366065021945,63.58939791199695 L 368.7366065021945,140.99204956471644 L 370.7366065021945,110 L 373.9729984882036,110 L 376.37299848820356,103 L 379.9729984882036,92.5 L 383.5729984882036,103 L 385.9729984882036,110 L 391.74912326759573,110 L 534.0109699792331,110 L 542.0217114440368,110 L 542.0217114440368,110 L 544.0217114440368,118.08136784845857 L 546.0217114440368,58.527578966252115 L 548.0217114440368,136.48528570098364 L 550.0217114440368,110 L 554.0893060887133,110 L 556.4893060887133,103 L 560.0893060887133,92.5 L 563.6893060887134,103 L 566.0893060887133,110 L 570.5639347606934,110 L 555,110"/>
  

  <line class="divider" x1="570" y1="10" x2="570" y2="210"/>

  <text class="heart" x="585" y="33">&#x2665;</text>
  <text class="bpm" x="605" y="33">116</text>
  <text class="bpm-unit" x="638" y="33">bpm</text>

  <text class="label" x="585" y="62">ci pass rate</text>
  <text class="val-ci" x="780" y="62" text-anchor="end">70%</text>

  <text class="label" x="585" y="88">pr merge time</text>
  <text class="val-pr" x="757" y="88" text-anchor="end">2</text>
  <text class="val-unit" x="762" y="88">days</text>

  <text class="label" x="585" y="114">releases</text>
  <text class="val-rel" x="757" y="114" text-anchor="end">0</text>
  <text class="val-unit" x="762" y="114">/wk</text>

  <text class="label" x="585" y="140">response time</text>
  <text class="val-resp" x="757" y="140" text-anchor="end">11</text>
  <text class="val-unit" x="762" y="140">min</text>

  <rect class="bar-bg" x="585" y="158" width="195" height="8"/>
  <rect class="bar-fill" x="585" y="158" width="86" height="8"/>

  <circle class="status-dot" cx="593" cy="183" r="3.5"/>
  <text class="status-text" x="603" y="187">CRITICAL</text>
  <text class="val" x="757" y="187" text-anchor="end">44</text>
  <text class="val-unit" x="762" y="187">/100</text>

  <text class="repo-name" x="20" y="205">
    <tspan fill="#64748b">expressjs/</tspan>express
  </text>
  <text fill="#4b5563" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="8" x="555" y="205" text-anchor="end">last release: 106d ago</text>
</svg>