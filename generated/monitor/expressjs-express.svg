<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220">
  <defs>
    <style>
      @keyframes flat-sweep {
        0% { stroke-dashoffset: 2400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
      @keyframes fade-slow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.7; }
      }
      .noise {
        fill: none;
        stroke: #374151;
        stroke-width: 0.8;
        stroke-dasharray: 1200;
        animation: flat-sweep 8s linear infinite;
      }
      .bg { fill: #1a1c20; }
      .ecg-line {
        fill: none;
        stroke: #6b7280;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        /* no filter - avoids render glitch */
        stroke-dasharray: 2400;
        animation: flat-sweep 6s linear infinite;
      }
      .grid-line { stroke: #262a30; stroke-width: 0.5; }
      .label { fill: #94a3b8; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
      .val { fill: #e2e8f0; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 15px; font-weight: bold; }
      .val-unit { fill: #64748b; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 10px; }
      .val-ci { fill: #ef4444; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 15px; font-weight: bold;  }
      .val-pr { fill: #f59e0b; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 15px; font-weight: bold; }
      .val-rel { fill: #6b7280; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 15px; font-weight: bold; }
      .val-resp { fill: #4ade80; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 15px; font-weight: bold; }
      .repo-name { fill: #e2e8f0; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 14px; font-weight: bold; }
      .status-text { fill: #6b7280; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 12px; font-weight: bold; animation: fade-slow 3s ease-in-out infinite; }
      .status-dot { fill: #6b7280; animation: fade-slow 3s ease-in-out infinite; }
      .divider { stroke: #2e3238; stroke-width: 1; }
      .bar-bg { fill: #262a30; rx: 3; }
      .bar-fill { fill: #6b7280; rx: 3; opacity: 0.85; }
      .border { fill: none; stroke: #2e3238; stroke-width: 1; rx: 8; }
      .heart { fill: #6b7280; animation: pulse-glow 1s ease-in-out infinite; font-size: 18px; }
      .bpm { fill: #6b7280; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 22px; font-weight: bold; }
      .bpm-unit { fill: #4b5563; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 10px; }
    </style>
  </defs>

  <rect class="bg" width="800" height="220" rx="8"/>
  
  <rect class="border" x="0.5" y="0.5" width="799" height="219"/>

  <g opacity="0.15">
    <line class="grid-line" x1="0" y1="44" x2="555" y2="44"/>
    <line class="grid-line" x1="0" y1="88" x2="555" y2="88"/>
    <line class="grid-line" x1="0" y1="132" x2="555" y2="132"/>
    <line class="grid-line" x1="0" y1="176" x2="555" y2="176"/>
  </g>

  <path class="ecg-line" d="M 0,110 L 5,110 L 8,105 L 12,112.5 L 15,110 L 18.984394038081536,110 L 18.984394038081536,110 L 20.984394038081536,119.4487046740937 L 22.984394038081536,64.3298280158358 L 24.984394038081536,138.43545227852692 L 26.484394038081536,120.53443924806494 L 28.484394038081536,110 L 32.58583999060638,110 L 34.98583999060638,103 L 38.58583999060638,92.5 L 42.18583999060638,103 L 44.58583999060638,110 L 48.444899422996585,110 L 189.53261004158537,110 L 194.53261004158537,110 L 197.53261004158537,105 L 201.53261004158537,112.5 L 204.53261004158537,110 L 208.1793233893619,110 L 208.1793233893619,110 L 210.1793233893619,117.70723530052437 L 212.1793233893619,60.21962387181783 L 214.1793233893619,135.58621453362164 L 216.1793233893619,110 L 220.34442338193247,110 L 222.74442338193248,103 L 226.34442338193247,92.5 L 229.94442338193247,103 L 232.34442338193247,110 L 237.8893275674333,110 L 392.53216492899895,110 L 397.53216492899895,110 L 400.53216492899895,105 L 404.53216492899895,112.5 L 407.53216492899895,110 L 411.3775410450786,110 L 411.3775410450786,110 L 413.3775410450786,119.25520698389057 L 415.3775410450786,63.96245560745006 L 417.3775410450786,138.7565009265733 L 418.8775410450786,96.11937610303924 L 420.8775410450786,110 L 423.94883600571086,110 L 426.34883600571084,103 L 429.94883600571086,92.5 L 433.5488360057109,103 L 435.94883600571086,110 L 439.77142745374834,110 L 555,110 L 555,110"/>
  
  <path class="noise" d="
    M 0,110 L 50,110.5 L 100,109.5 L 150,110.3 L 200,109.7
    L 250,110.4 L 300,109.6 L 350,110.2 L 400,109.8
    L 450,110.3 L 500,109.7 L 555,110
  "/>

  <line class="divider" x1="570" y1="10" x2="570" y2="210"/>

  <text class="heart" x="585" y="33">&#x2665;</text>
  <text class="bpm" x="605" y="33">--</text>
  <text class="bpm-unit" x="630" y="33">bpm</text>

  <text class="label" x="585" y="62">ci pass rate</text>
  <text class="val-ci" x="780" y="62" text-anchor="end">70%</text>

  <text class="label" x="585" y="88">pr merge time</text>
  <text class="val-pr" x="757" y="88" text-anchor="end">2</text>
  <text class="val-unit" x="762" y="88">days</text>

  <text class="label" x="585" y="114">releases</text>
  <text class="val-rel" x="757" y="114" text-anchor="end">0</text>
  <text class="val-unit" x="762" y="114">/wk</text>

  <text class="label" x="585" y="140">response time</text>
  <text class="val-resp" x="757" y="140" text-anchor="end">11</text>
  <text class="val-unit" x="762" y="140">min</text>

  <rect class="bar-bg" x="585" y="158" width="195" height="8"/>
  <rect class="bar-fill" x="585" y="158" width="20" height="8"/>

  <circle class="status-dot" cx="593" cy="183" r="3.5"/>
  <text class="status-text" x="603" y="187">FLATLINE</text>
  <text class="val" x="757" y="187" text-anchor="end">10</text>
  <text class="val-unit" x="762" y="187">/100</text>

  <text class="repo-name" x="20" y="205">
    <tspan fill="#64748b">expressjs/</tspan>express
  </text>
  <text fill="#4b5563" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="8" x="555" y="205" text-anchor="end">last release: 106d ago</text>
</svg>